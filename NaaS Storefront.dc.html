.fx-hop .n{display:grid;min-width:0}.fx-hop .n b{color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-hop .n small{font-size:11px;line-height:14px;color:var(--text-light)}
.fx-hop .ms{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-body)}
.fx-hop .fx-btn{height:24px;padding:0 8px;font-size:11px}
.fx-trace-foot{display:flex;gap:8px;padding-top:6px;align-items:center;font-size:11px;color:var(--text-light)}
@media (max-height:719px){aside[aria-label$="sections"]{position:static!important;height:auto!important}aside[aria-label$="sections"]>div{overflow:visible!important}}
.fx-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fx-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;border:1px solid var(--border-secondary);background:var(--bg-wash);color:var(--text-body);font-size:11px;line-height:18px;font-weight:500;white-space:nowrap}
.fx-chip.auto{background:transparent;border-style:dashed;color:var(--text-light)}
.fx-chip.user{background:var(--bg-accent);border-color:transparent;color:var(--link);padding-right:2px}
.fx-chip.add{background:transparent;border-style:dashed;color:var(--link);cursor:pointer}
.fx-chip.add:hover{background:var(--bg-accent);border-color:var(--link)}
.fx-chip-x{width:16px;height:16px;border:0;border-radius:9999px;background:transparent;color:inherit;font-size:13px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.fx-chip-x:hover{background:rgba(0,0,0,.08)}
.fx-label-input{height:24px;padding:0 8px;border:1px solid var(--border-active);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px;min-width:150px;outline:none}
.fx-btn:hover{border-color:var(--border-active)}
.fx-spacer{margin-left:auto}
@keyframes bandBreathe{0%{opacity:.7}50%{opacity:1}100%{opacity:.92}}
/* The band folds and unfolds with an ease and a slight overshoot. Geometry moves through CSS (x, width, d, transform) so the browser eases one state into the other. */
.open-pill{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:9999px;background:var(--bg-accent);color:var(--link);font-size:11px;line-height:20px;font-weight:700;letter-spacing:0;white-space:nowrap;transition:background .15s,color .15s}
.open-n:empty{display:none}
.open-word{display:none}
.open-card:hover .open-word{display:inline}
.open-card:hover .open-n{display:none}
.open-card:hover .open-pill{background:var(--cta);color:#fff}
.open-card:hover .card-rect{stroke:var(--border-active)!important}
.fold-plus{transition:transform .15s}
.fold:hover .fold-plus{transform:scale(1.15)}
.fold{transition:transform .55s cubic-bezier(.34,1.45,.64,1),x .55s cubic-bezier(.34,1.45,.64,1),y .55s cubic-bezier(.34,1.45,.64,1),width .55s cubic-bezier(.34,1.45,.64,1),d .55s cubic-bezier(.34,1.45,.64,1),opacity .3s ease}
@media (prefers-reduced-motion:reduce){.fold{transition:none}.route-dot{display:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes crawl{to{stroke-dashoffset:-24}}
@keyframes pulseOnce{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<sc-if value="{{ hasOverlay }}" hint-placeholder-val="{{ false }}">

  <sc-if value="{{ showScrub }}" hint-placeholder-val="{{ false }}"><label style="margin-left:auto;display:flex;align-items:center;gap:10px;min-width:260px"><span style="white-space:nowrap">24h ago</span><input type="range" min="0" max="100" value="{{ scrubT }}" onChange="{{ setScrub }}" onInput="{{ setScrub }}" aria-label="Time scrubber" style="flex:1;accent-color:var(--cta)"></input><span>now</span></label></sc-if>
  <sc-if value="{{ showForecast }}" hint-placeholder-val="{{ false }}"><label style="margin-left:auto;display:flex;align-items:center;gap:10px;min-width:260px"><span style="white-space:nowrap">Forecast · {{ fcLabel }}</span><input type="range" min="0" max="100" value="{{ fcT }}" onChange="{{ setFc }}" onInput="{{ setFc }}" aria-label="Forecast slider" style="flex:1;accent-color:var(--cta)"></input><span>+90d</span></label></sc-if>

</sc-if>
</div>

<sc-if value="{{ regionDrilled }}" hint-placeholder-val="{{ false }}">

</div>
<sc-if value="{{ hasHealth }}" hint-placeholder-val="{{ true }}">

</sc-if>
</div>
</sc-if>

<!-- ===== S0 below hero: head start strip, mode tabs, intake or CTA ===== -->
<sc-if value="{{ sS0 }}" hint-placeholder-val="{{ true }}">
<aside aria-label="Head start" style="margin-top:24px;padding:20px 24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center">
  <div><div style="font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--text-disabled)">Before you tell us anything</div>
</div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px">
    <sc-for list="{{ headStart }}" as="h" hint-placeholder-count="4">
      <button onClick="{{ h.go }}" style="display:grid;gap:2px;border:0;border-left:1px solid var(--border-secondary);padding:0 0 0 16px;background:transparent;text-align:left;color:var(--text-heading);cursor:pointer;white-space:normal;min-width:0;align-content:start" style-hover="color:var(--link)">
        <span style="font-size:26px;line-height:34px;font-weight:700">{{ h.n }}</span>

<section style="margin-top:24px">

    <div style="display:grid;grid-template-columns:7fr 5fr;gap:24px;margin-top:24px">

        <div>
          <div style="font-size:18px;line-height:26px;font-weight:700;color:var(--text-heading)">Two things, then the store composes the rest</div>
          <div style="color:var(--text-light)">Read-only. {{ intakeCadenceLabel }}. No change to routing.</div>
        </div>
        <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Organization
          <input value="{{ intakeOrg }}" onChange="{{ setOrg }}" placeholder="Meridian Logistics" style="height:40px;padding:0 12px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px" style-focus="border-color:var(--border-active);outline:2px solid var(--border-active);outline-offset:1px"></input>
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <button type="button" onClick="{{ setSourceCred }}" style="text-align:left;padding:16px;border:1px solid {{ credBorder }};border-radius:16px;background:var(--bg-base);cursor:pointer;white-space:nowrap">
            <div style="font-weight:700;color:var(--text-heading)">A cloud credential</div>
            <div style="font-size:12px;color:var(--text-light)">Provider, auth type, read-only scope, {{ intakeCadenceLower }}</div>
          </button>
          <button type="button" onClick="{{ setSourceInv }}" style="text-align:left;padding:16px;border:1px solid {{ invBorder }};border-radius:16px;background:var(--bg-base);cursor:pointer;white-space:nowrap">
            <div style="font-weight:700;color:var(--text-heading)">Existing inventory</div>
            <div style="font-size:12px;color:var(--text-light)">NetBond, AVPN (MPLS VPN) base</div>
          </button>
        </div>
        <sc-if value="{{ srcCredential }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
            <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Provider

            </label>
            <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Auth type
              <select style="height:40px;padding:0 10px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px"><option>Cross-account role</option><option>Service principal</option><option>Service account</option></select>
            </label>
            <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Scope
              <select style="height:40px;padding:0 10px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px"><option>Read-only, all regions</option><option>Read-only, selected regions</option></select>
            </label>
          </div>
        </sc-if>
        <sc-if value="{{ srcInventory }}" hint-placeholder-val="{{ false }}">
          <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Inventory
            <select style="height:40px;padding:0 10px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px"><option>NetBond connections</option><option>AVPN (MPLS VPN) sites</option></select>
          </label>
        </sc-if>
        <div style="display:flex;align-items:center;gap:16px">
          <button type="button" onClick="{{ startScan }}" style="height:36px;padding:0 16px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">Scan</button>
          <span style="font-size:12px;color:var(--text-light)">Read-only, {{ intakeCadenceLower }}, no change to routing.</span>
        </div>
      </form>
      <div style="padding:24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px">
        <div style="font-size:11px;line-height:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--text-disabled)">Or start from the outcome</div>
        <p style="margin:8px 0 16px;color:var(--text-body);text-wrap:pretty">Describe the outcome. AT&amp;T composes the connection, with its policy, savings and telemetry.</p>
        <button onClick="{{ goCompose }}" style="height:36px;padding:0 16px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--bg-accent)">Compose</button>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:center;gap:24px;margin-top:24px;padding:24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px">
      <div style="flex:1">
        <div style="font-size:18px;line-height:26px;font-weight:700;color:var(--text-heading)">{{ estateName }} is recognized</div>
        <div style="color:var(--text-light)">Your floor is ready: findings, packages and offers tailored to what already runs.</div>
      </div>
      <button onClick="{{ goDiscover }}" style="height:36px;padding:0 16px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap">See the estate</button>
      <button onClick="{{ goFloor }}" style="height:36px;padding:0 16px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">Home</button>
    </div>

</section>
</sc-if>

<!-- ===== S1 DISCOVER ===== -->
<sc-if value="{{ sS1 }}" hint-placeholder-val="{{ false }}">
<section data-screen-label="S1 Discover" style="animation:fadeIn .3s;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)">
  <div style="display:flex;align-items:center;gap:16px;min-height:40px;flex-wrap:wrap">
    <h1 style="margin:0;font-size:26px;line-height:34px;font-weight:700;color:var(--text-heading)">{{ s1Title }}</h1>
    <sc-if value="{{ showEstateStats }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ invStats }}" as="k" hint-placeholder-count="5"><span style="display:inline-flex;align-items:baseline;gap:5px;height:28px;padding:0 10px;border-radius:9999px;background:var(--bg-base);border:1px solid var(--border-secondary);font-size:12px;color:var(--text-light);white-space:nowrap"><strong style="font-size:13px;color:var(--text-heading)">{{ k.v }}</strong>{{ k.l }}</span></sc-for><sc-if value="{{ newStrip.hasNew }}" hint-placeholder-val="{{ false }}"><button class="fx-badge new" onClick="{{ newStrip.toggle }}" aria-pressed="{{ newOnly }}" style="height:28px;padding:0 10px;font-size:12px;cursor:pointer">{{ newStrip.pill }}</button></sc-if></div></sc-if>
    <sc-if value="{{ scanning }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;color:var(--text-light)">Scanning…</span></sc-if>
    <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <button onClick="{{ openAddSource }}" style="height:32px;padding:0 12px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--bg-accent)">+ Add a source</button>
      <sc-if value="{{ scanDone }}" hint-placeholder-val="{{ false }}"><button onClick="{{ stationCta.go }}" style="height:32px;padding:0 14px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">{{ stationCta.label }}</button></sc-if>
    </span>
  </div>
  <sc-if value="{{ scanning }}" hint-placeholder-val="{{ true }}">
  <div aria-busy="true" aria-label="Reading the estate" style="display:grid;gap:16px">
    <div style="display:flex;align-items:center;gap:10px;font-size:13px;line-height:18px;color:var(--text-body)"><span aria-hidden="true" style="width:14px;height:14px;border-radius:9999px;border:2px solid var(--cta);border-top-color:transparent;animation:skSpin .9s linear infinite;flex:none"></span>{{ scanLine }}</div>
    <div style="display:grid;gap:10px;padding:14px 16px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:12px">
      <sc-for list="{{ scanSteps }}" as="sst" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:18px minmax(0,1fr);gap:12px;align-items:start;min-width:0">
          <span aria-hidden="true" style="width:16px;height:16px;margin-top:2px;box-sizing:border-box;border-radius:9999px;border:2px solid {{ sst.color }};background:{{ sst.fillBg }};color:#fff;font-size:10px;line-height:12px;text-align:center">{{ sst.mark }}</span>
          <div style="display:grid;gap:2px;min-width:0">
            <div style="font-size:13px;line-height:18px;font-weight:500;color:{{ sst.textColor }};text-wrap:pretty">{{ sst.label }}</div>
            <div style="font-size:11px;line-height:16px;color:var(--text-light);text-wrap:pretty">{{ sst.src }}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <!-- The skeleton is the Estate it becomes: a tab row and three cards, inside the fold (no-scroll pass, 2026-09-28) -->
    <div style="display:flex;gap:18px"><div class="sk" style="width:110px;height:28px"></div><div class="sk" style="width:90px;height:28px"></div><div class="sk" style="width:90px;height:28px"></div></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px"><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div></div>
  </div>
  </sc-if>
  <sc-if value="{{ cadenceAsk }}" hint-placeholder-val="{{ false }}">
  <div class="fx-alert" role="status" aria-label="Keep it current" style="animation:fadeIn .3s">
    <div class="fx-alert-body"><span class="fx-alert-icon" aria-hidden="true"></span><div style="display:grid;gap:2px;min-width:0"><div class="fx-alert-title">Keep it current</div><div class="fx-alert-text">{{ cadenceAskText }}</div></div></div>
    <label class="fx-filter"><span class="fx-label">Cadence</span><select class="fx-select" value="{{ intakeCadence }}" onChange="{{ setIntakeCadence }}" aria-label="Discovery cadence"><option value="h6">Every 6 hours</option><option value="h12">Every 12 hours</option><option value="nightly">Nightly at 02:00</option><option value="weekly">Sundays at 03:00</option><option value="manual">Manual only</option></select></label>
    <button class="fx-btn" onClick="{{ confirmCadence }}">Keep this cadence</button>
  </div>
  </sc-if>
  <sc-if value="{{ scanDone }}" hint-placeholder-val="{{ false }}">
  <!-- Source management: the connected accounts on the page; the drawer adds a source or edits one's credentials and schedule (2026-09-23) -->
  <sc-if value="{{ showSourcesBody }}" hint-placeholder-val="{{ false }}">
    <div id="sec-accounts" aria-label="Sources" style="display:grid;gap:10px;animation:fadeIn .3s">
      <div class="fx-card-head"><div><h3 class="fx-card-title">Connected accounts</h3><div class="fx-card-sub">{{ sourcesSub }}</div></div><button class="fx-btn" onClick="{{ openAddSource }}" style="height:32px;background:var(--cta);color:#fff;border-color:var(--cta)">Add a source</button></div>
      <div class="dt">
        <div class="dt-h"><div class="dt-r">
          <div class="dt-c dt-th" style="width:22%">Account</div>
          <div class="dt-c dt-th" style="width:14%">Credential</div>
          <div class="dt-c dt-th" style="width:15%">Scope</div>
          <div class="dt-c dt-th" style="width:11%">Last scan</div>
          <div class="dt-c dt-th" style="width:11%">Next scan</div>
          <div class="dt-c dt-th" style="width:15%">Cadence</div>
          <div class="dt-c dt-th" style="width:12%">Manage</div>
        </div></div>
        <div class="dt-b"><sc-for list="{{ sources }}" as="sr" hint-placeholder-count="4">
          <div class="dt-r">
            <div data-th="Account" class="dt-c"><span style="display:flex;align-items:center;gap:8px;min-width:0"><i style="width:8px;height:8px;border-radius:9999px;background:{{ sr.dot }};flex:none"></i><span class="dt-name" style="overflow-wrap:anywhere">{{ sr.name }}</span></span></div>
            <div data-th="Credential" class="dt-c" style="overflow-wrap:anywhere">{{ sr.cred }}</div>
            <div data-th="Scope" class="dt-c" style="color:var(--text-light);overflow-wrap:anywhere">{{ sr.scope }}</div>
            <div data-th="Last scan" class="dt-c" style="color:var(--text-light);white-space:nowrap">{{ sr.seen }}</div>
            <div data-th="Next scan" class="dt-c" style="color:var(--text-light);white-space:nowrap">{{ sr.nextSeen }}</div>
            <div data-th="Cadence" class="dt-c">
              <sc-if value="{{ sr.canSchedule }}" hint-placeholder-val="{{ true }}"><select class="dt-select" value="{{ sr.cadenceValue }}" onChange="{{ sr.setCadence }}" aria-label="Cadence"><option value="h6">Every 6 hours</option><option value="h12">Every 12 hours</option><option value="nightly">Nightly at 02:00</option><option value="weekly">Sundays at 03:00</option><option value="manual">Manual only</option></select></sc-if>
              <sc-if value="{{ sr.noSchedule }}" hint-placeholder-val="{{ false }}"><span style="color:var(--text-light)">{{ sr.cadenceLabel }}</span></sc-if>
            </div>
            <div data-th="Manage" class="dt-c"><span style="display:flex;gap:16px"><button class="dt-link" onClick="{{ sr.rescan }}">Re-scan</button><button class="dt-link" onClick="{{ sr.edit }}">Edit access</button></span></div>
          </div>
        </sc-for></div>
      </div>
      <sc-if value="{{ srcPager.many }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;line-height:16px;color:var(--text-light)"><span>{{ srcPager.label }}</span><button class="fx-btn" onClick="{{ srcPager.prev }}" aria-label="Previous page" style="opacity:{{ srcPager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ srcPager.next }}" aria-label="Next page" style="opacity:{{ srcPager.nextOp }}">›</button></div></sc-if>
    </div>
  </sc-if>
  <sc-if value="{{ showEstateBody }}" hint-placeholder-val="{{ true }}">
  <div style="display:grid;gap:16px;animation:fadeIn .3s">
    <div role="tablist" aria-label="Estate views" style="display:flex;align-items:center;border-bottom:1px solid var(--border-secondary)"><sc-for list="{{ estPanels }}" as="ep" hint-placeholder-count="3"><button role="tab" aria-selected="{{ ep.on }}" onClick="{{ ep.go }}" style="border:0;border-bottom:2px solid {{ ep.line }};background:transparent;padding:6px 2px;margin-right:18px;font:inherit;font-size:15px;line-height:22px;font-weight:{{ ep.weight }};color:{{ ep.color }};cursor:pointer;white-space:nowrap">{{ ep.label }}</button></sc-for><span style="flex:1"></span><sc-if value="{{ estPanelGlance }}" hint-placeholder-val="{{ true }}"><label class="fx-filter"><span class="fx-label">Since</span><select class="fx-select" value="{{ rangeValue }}" onChange="{{ setRange }}" aria-label="Discovery window"><option value="1h">Last hour</option><option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option><option value="30d">Last 30 days</option><option value="90d">Last 90 days</option><option value="6m">Last 6 months</option><option value="12m">Last 12 months</option></select></label></sc-if></div>
    <sc-if value="{{ anyFacetOpen }}" hint-placeholder-val="{{ false }}"><div onClick="{{ closeFacets }}" style="position:fixed;inset:0;z-index:10"></div></sc-if>
    <sc-if value="{{ estPanelGlance }}" hint-placeholder-val="{{ false }}">
    <!-- At a glance with oomph, down to the app level (Micah, 2026-09-29): four rings, then the apps, then the gaps on a line each. -->
    <div aria-label="Estate at a glance" style="display:grid;gap:14px">
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
        <sc-for list="{{ glanceRings }}" as="gr" hint-placeholder-count="4"><div class="fx-card sm" style="display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:12px 14px;min-width:0">
