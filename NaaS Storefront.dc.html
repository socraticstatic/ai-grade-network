<script data-build="__BUILD_SHA__">
  // Load React, ReactDOM and Babel from this folder, never from unpkg: on
  // networks that block or rewrite the CDN the integrity check fails and the
  // page never renders. support.js reads this map before it builds the tags.
  window.__resources = {
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react.production.min.js",
    "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom.production.min.js",
    "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "./vendor/babel.min.js"
  };
</script>
<script data-build="__BUILD_SHA__">
  // Cache kill: GitHub Pages caches documents for ten minutes. On load, ask
  // the server which build is live (never from cache); if it is not the
  // build this page was stamped with, reload once so nobody has to know
  // about hard refresh.
  (function () {
    try {
      if (sessionStorage.getItem('naas-reloaded') === '1') return;
      var mine = (document.currentScript && document.currentScript.getAttribute('data-build')) || '';
      fetch('./version.js?nocache=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : ''; })
        .then(function (t) {
          var m = /sha:\s*"([0-9a-f]+)"/.exec(t);
          if (m && mine && m[1] !== mine) {
            sessionStorage.setItem('naas-reloaded', '1');
            location.reload();
          }
        }).catch(function () {});
    } catch (e) {}
  })();
</script>
<script src="./support.js"></script>

<main style="min-width:0;max-width:1392px;margin:0 auto;padding:16px 24px 16px;width:100%;box-sizing:border-box">
<!-- The existing customer's journey as one picture that builds (2026-10-08, Micah: "really focus on the journey for an AT&T existing already last mile ... story-based, and sequential, without too many words", then "make it simpler, more elegant, better in every way"): your sites, the AT&T network and your cloud on one stage that never leaves the screen. Each beat changes one thing on it and says it in one sentence; a slim stepper replaces the rail; one action moves the story on. -->
<sc-if value="{{ journeyOn }}" hint-placeholder-val="{{ false }}">
<section class="js" aria-label="Existing customer journey" data-beat="{{ jBeatKey }}">
  <ol class="js-steps" aria-label="Steps"><sc-for list="{{ jSteps }}" as="st" hint-placeholder-count="6"><li data-state="{{ st.state }}"><button onClick="{{ st.go }}" disabled="{{ st.off }}" aria-current="{{ st.cur }}" title="{{ st.title }}"><i><sc-if value="{{ st.hasIcon }}" hint-placeholder-val="{{ false }}"><span class="ic s14" style="--ic:url('brand/icons/check-circle.svg')"></span></sc-if><sc-if value="{{ st.noIcon }}" hint-placeholder-val="{{ true }}">{{ st.n }}</sc-if></i><span>{{ st.label }}</span></button></li></sc-for></ol>
  <div class="js-body">
  <h1 class="js-line">{{ jLine }}</h1>
  <div class="js-stage" data-wide="{{ jWide }}" data-link="{{ jLink }}" data-net="{{ jNet }}" data-flow="{{ jFlow }}" data-live="{{ jLive }}" data-verdict="{{ jVerdict }}" data-why="{{ jDetailOpen }}">
    <!-- Your sites as the sites themselves (2026-10-08, "the 20 on the left - look at how much space is wasted"): the count on top, one glyph per real site on the wire, tinted by its access, and the access legend under them in the same inks. -->
    <div class="js-node js-sites" aria-label="Your sites">
      <span class="js-sites-h"><span class="js-cap">Your sites</span><b class="js-big">{{ jSites.n }}</b></span>
      <div class="js-sitegrid" role="list" aria-label="{{ jSites.n }} sites"><sc-for list="{{ jSites.cells }}" as="sc" hint-placeholder-count="20"><span role="listitem" class="ic s20" title="{{ sc.title }}" aria-label="{{ sc.title }}" style="--ic:url('brand/icons/{{ sc.icon }}.svg');color:{{ sc.ink }};animation-delay:{{ sc.d }}"></span></sc-for></div>
      <div class="js-svc"><sc-for list="{{ jSites.groups }}" as="sg" hint-placeholder-count="4"><span title="{{ sg.title }}"><span class="ic s16" style="--ic:url('brand/icons/{{ sg.icon }}.svg');color:{{ sg.ink }}"></span><b>{{ sg.nF }}</b>{{ sg.label }}</span></sc-for></div>
    </div>

  <g opacity="{{ inetOp }}" style="transition:opacity .2s">

</svg>
<sc-if value="{{ hasOverlay }}" hint-placeholder-val="{{ false }}">

</div>

</div>

<!-- ===== The empty estate's onboarding on s2 (the old s0 front door; s0 is the NaaS home since 2026-09-30): head start strip and intake ===== -->
<sc-if value="{{ sS0 }}" hint-placeholder-val="{{ true }}">
<aside aria-label="Head start" style="margin-top:24px;padding:20px 24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:center">
  <div><div style="font-size:12px;line-height:16px;font-weight:500;color:var(--text-body)">Before you tell us anything</div>
</div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px">
    <sc-for list="{{ headStart }}" as="h" hint-placeholder-count="4">
      <button onClick="{{ h.go }}" style="display:grid;gap:2px;border:0;border-left:1px solid var(--border-secondary);padding:0 0 0 16px;background:transparent;text-align:left;color:var(--text-heading);cursor:pointer;white-space:normal;min-width:0;align-content:start" style-hover="color:var(--link)">
        <span style="font-size:26px;line-height:34px;font-weight:700">{{ h.n }}</span>

        <div>
          <div style="font-size:18px;line-height:26px;font-weight:700;color:var(--text-heading)">Two things, then the store composes the rest</div>

        </div>
        <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Organization
          <input value="{{ intakeOrg }}" onChange="{{ setOrg }}" placeholder="Meridian Logistics" style="height:40px;padding:0 12px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px" style-focus="border-color:var(--border-active);outline:2px solid var(--border-active);outline-offset:1px"></input>
        </label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <button type="button" onClick="{{ setSourceCred }}" style="text-align:left;padding:16px;border:1px solid {{ credBorder }};border-radius:16px;background:var(--bg-base);cursor:pointer;white-space:nowrap">
            <div style="font-weight:700;color:var(--text-heading)">A cloud credential</div>
            <div style="font-size:12px;color:var(--text-light)">Provider, auth type, read-only scope, {{ intakeCadenceLower }}</div>
          </button>
          <button type="button" onClick="{{ setSourceInv }}" style="text-align:left;padding:16px;border:1px solid {{ invBorder }};border-radius:16px;background:var(--bg-base);cursor:pointer;white-space:nowrap">

            <div style="font-size:12px;color:var(--text-light)">NetBond, AVPN (MPLS VPN) base</div>
          </button>
        </div>
        <sc-if value="{{ srcCredential }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">

            </label>

            </label>
            <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Scope

            </label>
          </div>
        </sc-if>
        <sc-if value="{{ srcInventory }}" hint-placeholder-val="{{ false }}">
          <label style="display:grid;gap:6px;font-size:12px;font-weight:500;color:var(--text-light)">Inventory
            <select style="height:40px;padding:0 10px;border:1px solid var(--border-secondary);border-radius:8px;background:var(--bg-base);color:var(--text-heading);font-size:14px"><option>NetBond connections</option><option>AVPN (MPLS VPN) sites</option></select>

        <div style="display:flex;align-items:center;gap:16px">
          <button type="button" onClick="{{ startScan }}" style="height:36px;padding:0 16px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">Scan</button>
          <span style="font-size:12px;color:var(--text-light)">Read-only, {{ intakeCadenceLower }}, no change to routing.</span>
        </div>
      </form>
      <div style="padding:24px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px">
        <div style="font-size:12px;line-height:16px;font-weight:500;color:var(--text-body)">Or start from the outcome</div>
        <p style="margin:8px 0 16px;color:var(--text-body);text-wrap:pretty">Describe the outcome. AT&amp;T composes the connection, with its policy, savings and telemetry.</p>

<!-- ===== S1 DISCOVER ===== -->
<sc-if value="{{ sS1 }}" hint-placeholder-val="{{ false }}">
<section data-screen-label="S1 Discover" style="animation:fadeIn .3s;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)">

      <button onClick="{{ openAddSource }}" style="height:32px;padding:0 12px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--bg-accent)">+ Add a source</button>
      <sc-if value="{{ scanDone }}" hint-placeholder-val="{{ false }}"><button onClick="{{ stationCta.go }}" style="height:32px;padding:0 14px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">{{ stationCta.label }}</button></sc-if>
    </span>
  </div>
  <sc-if value="{{ scanning }}" hint-placeholder-val="{{ true }}">
  <div aria-busy="true" aria-label="Reading the estate" style="display:grid;gap:16px">
    <div style="display:flex;align-items:center;gap:10px;font-size:13px;line-height:18px;color:var(--text-body)"><span aria-hidden="true" style="width:14px;height:14px;border-radius:9999px;border:2px solid var(--cta);border-top-color:transparent;animation:skSpin .9s linear infinite;flex:none"></span>{{ scanLine }}</div>
    <div style="display:grid;gap:10px;padding:14px 16px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:12px">

          <div style="display:grid;gap:2px;min-width:0">
            <div style="font-size:13px;line-height:18px;font-weight:500;color:{{ sst.textColor }};text-wrap:pretty">{{ sst.label }}</div>
            <div style="font-size:12px;line-height:16px;color:var(--text-light);text-wrap:pretty">{{ sst.src }}</div>
          </div>
        </div>

    </div>
    <!-- The skeleton is the Estate it becomes: a tab row and three cards, inside the fold (no-scroll pass, 2026-09-28) -->

    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px"><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div><div class="sk" style="height:calc(100vh - 500px);min-height:160px;border-radius:16px"></div></div>
  </div>
  </sc-if>
  <sc-if value="{{ cadenceAsk }}" hint-placeholder-val="{{ false }}">

      <div style="border-top:1px solid var(--border-secondary)"><sc-for list="{{ govDrillRows }}" as="gd" hint-placeholder-count="6"><button class="gv-row" onClick="{{ gd.go }}" title="Open {{ gd.name }}">

        <span style="font-size:13px;line-height:18px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ gd.where }}</span>
        <span style="font-size:13px;line-height:18px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ gd.why }}</span>

      <sc-if value="{{ govDrillPager.many }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;line-height:16px;color:var(--text-light)"><span>{{ govDrillPager.label }}</span><button class="fx-btn" onClick="{{ govDrillPager.prev }}" aria-label="Previous page" style="opacity:{{ govDrillPager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ govDrillPager.next }}" aria-label="Next page" style="opacity:{{ govDrillPager.nextOp }}">›</button></div></sc-if>
    </div>
    </sc-if>
    <sc-if value="{{ govPanelPolicies }}" hint-placeholder-val="{{ true }}"><sc-if value="{{ govListPolicies }}" hint-placeholder-val="{{ true }}">
    <!-- Findings, visual (2026-10-13, Micah: "Govern is extremely verbose - make it more visual, more beautiful, more amazing"): each finding is its tile, its count (the door to the set it counts), its kind in a few words, where it lands, the path it breaks as the strip and a compact fix; the sentence is the row's title. One grid with the policies below, so every strip sits under one set of station heads. -->

      <sc-for list="{{ governFindings }}" as="f" hint-placeholder-count="2"><div role="listitem" class="gvv-r gvf" title="{{ f.head }}">

    </div></sc-if></sc-if>
    <div class="gvv-pol">
      <!-- The Policies head (2026-10-13, Govern visual): the title, the total as a glyph and a door (its words in the title), the station words over the strips, the actions. Simulate, Enforce and Undo, when there is something simulated, take the heads' column too. -->
      <div class="gvv-h gvp-head">
        <div id="sec-policies" class="gvv-ht"><h3>Policies</h3><sc-if value="{{ hasPolViolGo }}" hint-placeholder-val="{{ true }}"><button class="vchip gvv-tot" onClick="{{ polViolGo }}" title="{{ polViolLine }}" aria-label="{{ polViolLine }}"><span class="ic s16" style="--ic:url('brand/icons/exclamation-circle.svg')"></span><b>{{ polViolN }}</b></button></sc-if><sc-if value="{{ noPolViolGo }}" hint-placeholder-val="{{ false }}"><span class="vchip gvv-tot q" role="img" title="{{ polViolLine }}" aria-label="{{ polViolLine }}"><span class="ic s16" style="--ic:url('brand/icons/{{ polViolIcon }}.svg')"></span><b>{{ polViolN }}</b></span></sc-if><sc-if value="{{ polFilterOn }}" hint-placeholder-val="{{ false }}"><span class="fx-chip" style="height:24px;padding:0 4px 0 10px;font-size:12px;border-color:var(--border-active);color:var(--link);background:var(--bg-accent)">{{ polFilterLabel }}<button class="fx-chip-x" onClick="{{ clearPolFilter }}" aria-label="Show every policy">×</button></span></sc-if></div>

        <div class="gvv-acts" style="grid-column:{{ polActCol }}">
          <sc-if value="{{ hasSim }}" hint-placeholder-val="{{ false }}"><button onClick="{{ simulate }}" style="height:36px;padding:0 16px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--bg-accent)">Simulate</button>
          <button onClick="{{ enforce }}" disabled="{{ enforceDisabled }}" style="height:36px;padding:0 16px;border:0;border-radius:9999px;background:{{ enforceBg }};color:{{ enforceColor }};font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap">Enforce</button>
          <button onClick="{{ undo }}" style="height:36px;padding:0 12px;border:0;border-radius:9999px;background:transparent;color:var(--text-light);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap">Undo</button></sc-if>
          <button onClick="{{ openAuthor }}" style="height:36px;padding:0 16px;border:0;border-radius:9999px;background:var(--cta);color:#fff;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap" style-hover="background:var(--cta-hover)">Author</button>
        </div>

      <sc-if value="{{ authoring }}" hint-placeholder-val="{{ false }}">

        <div style="display:flex;gap:20px;align-items:stretch;min-height:272px">
          <nav class="fw-vtabs" role="tablist" aria-label="Policy views"><sc-for list="{{ aCats }}" as="ac" hint-placeholder-count="4"><div style="display:grid;gap:2px"><span class="fw-vcat">{{ ac.label }}</span><sc-for list="{{ ac.tabs }}" as="at" hint-placeholder-count="2"><button class="fw-vtab" role="tab" aria-selected="{{ at.on }}" onClick="{{ at.go }}"><span class="ic" style="--ic:url('brand/icons/{{ at.icon }}.svg')"></span>{{ at.label }}</button></sc-for></div></sc-for></nav>

            <sc-if value="{{ aIntent }}" hint-placeholder-val="{{ true }}">

              <div class="fw-sec"><h4><span class="ic s16" style="--ic:url('brand/icons/check-shield.svg')"></span>3. Require</h4><sc-for list="{{ aReq }}" as="cd" hint-placeholder-count="1"><button class="fw-row pick" aria-pressed="{{ cd.on }}" onClick="{{ cd.click }}" title="{{ cd.desc }}" style="width:100%;font:inherit;text-align:left"><span class="ic s16" style="--ic:url('brand/icons/{{ cd.icon }}.svg');color:var(--text-light)"></span><b>{{ cd.label }}</b><sc-if value="{{ cd.on }}" hint-placeholder-val="{{ false }}"><span class="ic s16" style="--ic:url('brand/icons/check-circle.svg');color:var(--link)"></span></sc-if></button></sc-for></div>
            </div>
            </sc-if>
            <sc-if value="{{ aSvcOn }}" hint-placeholder-val="{{ false }}"><div aria-label="Multi-path and egress" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start"><sc-for list="{{ aRouting }}" as="ag" hint-placeholder-count="2"><div class="fw-sec"><h4><span class="ic s16" style="--ic:url('brand/icons/{{ ag.icon }}.svg')"></span>{{ ag.label }}</h4><sc-for list="{{ ag.opts }}" as="ao" hint-placeholder-count="3"><div class="fw-row"><b>{{ ao.label }}</b><span class="fw-dir">{{ ao.layerLabel }}</span><button class="fw-toggle sm" aria-pressed="{{ ao.on }}" onClick="{{ ao.go }}" aria-label="{{ ao.label }}"></button></div></sc-for></div></sc-for></div></sc-if>

            <sc-if value="{{ aOutOn }}" hint-placeholder-val="{{ false }}"><div aria-label="Outcome" style="display:grid;gap:14px">

            </div></sc-if>

          <div class="trf-plot" role="img" aria-label="Traffic over time, on AT&amp;T under outside AT&amp;T" title="{{ otSeriesLine }}">

            <div class="trf-cols" style="top:{{ trfTime.colsTop }}"><sc-for list="{{ otBars }}" as="ob" hint-placeholder-count="30"><span title="{{ ob.title }}" style="--trf-d:{{ ob.d }}"><i style="height:{{ ob.outH }};background:{{ otOutFill }}"></i><i style="height:{{ ob.fabH }};background:{{ otFabFill }}"></i></span></sc-for></div>
            <sc-if value="{{ trfTime.hasAvg }}" hint-placeholder-val="{{ true }}"><span class="trf-avg" style="top:{{ trfTime.avgTop }}" title="Average across the chart: {{ trfTime.avgF }}"></span></sc-if>

        <div class="trf-cf">

          <span class="trf-acts"><button class="ins-go" onClick="{{ trfTime.replay.go }}" title="{{ trfTime.replay.title }}" aria-label="{{ trfTime.replay.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfTime.replay.icon }}.svg')"></span>{{ trfTime.replay.label }}</button><button class="ins-go" data-primary="{{ trfTime.cta.primary }}" onClick="{{ trfTime.cta.go }}" title="{{ trfTime.cta.title }}" aria-label="{{ trfTime.cta.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfTime.cta.icon }}.svg')"></span>{{ trfTime.cta.label }}</button></span>
        </div>
      </div>
      </sc-if></sc-if>
      <!-- Where it goes (a story 2026-10-13): each destination class a bar on one scale, split on and outside AT&T, its record door and
           its verb; beside it the split as one ring, each part a door to its records. -->
      <sc-if value="{{ obPanelWhere }}" hint-placeholder-val="{{ false }}">
      <div class="trf-grid trf-where" aria-label="Where it goes">
        <div class="fx-card trf-card" data-span="8" aria-label="Destinations" style="--trf-i:0">
          <div class="trf-ch"><button class="cst-hb" onClick="{{ trfWhere.records.go }}" title="{{ mixSub }} Pick a row to explain it, down to the records."><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/globe.svg')"></span></span><b>Destinations</b><span class="ic s16 cst-chev" style="--ic:url('brand/icons/chevron-right.svg')"></span></button></div>
          <div class="trf-rows"><sc-for list="{{ trfWhere.rows }}" as="mx" hint-placeholder-count="6"><div class="trf-wrow" style="--trf-d:{{ mx.i }}">
            <span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/{{ mx.icon }}.svg')"></span></span>
            <button class="trf-wn" onClick="{{ mx.explainGo }}" title="Explain this figure, down to the records">{{ mx.label }}</button>
            <span class="trf-wbar" title="{{ mx.on }} on AT&amp;T: {{ mx.onTitle }}"><span style="width:{{ mx.w }}"><i data-k="att" style="width:{{ mx.fabPart }}"></i><i data-k="out" style="width:{{ mx.outPart }}"></i><i data-k="loc" style="width:{{ mx.locPart }}"></i></span></span>

            <button class="trf-verb" onClick="{{ mx.verb.go }}" title="{{ mx.verb.title }}" aria-label="{{ mx.verb.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ mx.verb.icon }}.svg')"></span></button>
          </div></sc-for></div>
          <div class="trf-cf"><span></span><button class="ins-go" data-primary="{{ trfWhere.cta.primary }}" onClick="{{ trfWhere.cta.go }}" title="{{ trfWhere.cta.title }}" aria-label="{{ trfWhere.cta.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfWhere.cta.icon }}.svg')"></span>{{ trfWhere.cta.label }}</button></div>
        </div>
        <div class="fx-card trf-card" data-span="4" aria-label="The split" style="--trf-i:1">
          <div class="trf-ch"><span class="cst-hb"><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/pie-chart.svg')"></span></span><b>The split</b></span></div>
          <div class="trf-split">
            <span class="trf-donut" role="img" aria-label="{{ trfWhere.ringC }} {{ trfWhere.ringU }}, on AT&amp;T, outside it and inside a region" style="--trf-ring:{{ trfWhere.ring }}"><b>{{ trfWhere.ringC }}</b><small>{{ trfWhere.ringU }}</small></span>
            <div class="trf-parts"><sc-for list="{{ trfWhere.parts }}" as="pp" hint-placeholder-count="3"><button class="trf-part" onClick="{{ pp.open.go }}" title="{{ pp.open.title }}" aria-label="{{ pp.open.aria }}"><i style="background:{{ pp.ink }}"></i><span class="ic s16" style="--ic:url('brand/icons/{{ pp.icon }}.svg')"></span><span class="trf-ptl">{{ pp.label }}</span><b>{{ pp.pct }}</b><small>{{ pp.gF }}</small></button></sc-for></div>
          </div>
          <div class="trf-cf"><span></span><button class="ins-go" onClick="{{ trfWhere.records.go }}" title="{{ trfWhere.records.title }}" aria-label="{{ trfWhere.records.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfWhere.records.icon }}.svg')"></span>{{ trfWhere.records.label }}</button></div>
        </div>
      </div>
      </sc-if>
      <!-- Health (notes, 2026-09-30; a story 2026-10-13): is it up. The view as chips; Path by app draws every app group across the seven
           stations beside the open problems, each with its owner, its reach, its ticket and its move; App health reads each app's compute,
           database and network against your thresholds; By segment says who answers for each piece and drills in place. -->
      <sc-if value="{{ obPanelHealth }}" hint-placeholder-val="{{ false }}">
      <div class="trf-health" aria-label="Health">
        <div class="trf-top">
          <div role="tablist" aria-label="Health view" class="trf-seg"><sc-for list="{{ healthViews }}" as="hv" hint-placeholder-count="3"><button role="tab" aria-selected="{{ hv.on }}" onClick="{{ hv.go }}">{{ hv.label }}</button></sc-for></div>
          <sc-if value="{{ healthInCloud }}" hint-placeholder-val="{{ false }}">
          <div role="group" aria-label="Show apps by state" class="trf-states"><sc-for list="{{ appStateChips }}" as="as" hint-placeholder-count="4"><button class="vchip" aria-pressed="{{ as.on }}" onClick="{{ as.go }}" title="{{ as.title }}"><span class="ic s16" style="--ic:url('brand/icons/{{ as.icon }}.svg')" data-k="{{ as.key }}"></span><b>{{ as.n }}</b>{{ as.word }}</button></sc-for></div>
          
          </sc-if>
        </div>
        <sc-if value="{{ healthByApp }}" hint-placeholder-val="{{ true }}">
        <div class="trf-grid">
          <!-- Each app group across the seven stations (2026-10-02): the strip Govern draws, in Traffic's health inks; the row's state sits on the node. -->
          <div class="fx-card trf-card" data-span="7" aria-label="Path by app" style="--trf-i:0">
            <div class="trf-ch"><button class="cst-hb" onClick="{{ trfHealth.paths.go }}" title="{{ trfHealth.paths.title }}"><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/hub.svg')"></span></span><b>Path by app</b><span class="ic s16 cst-chev" style="--ic:url('brand/icons/chevron-right.svg')"></span></button><sc-if value="{{ pathPager.many }}" hint-placeholder-val="{{ false }}"><span class="cst-pager trf-end"><span>{{ pathPager.label }}</span><button class="fx-btn" onClick="{{ pathPager.prev }}" aria-label="Previous apps" style="opacity:{{ pathPager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ pathPager.next }}" aria-label="Next apps" style="opacity:{{ pathPager.nextOp }}">›</button></span></sc-if></div>
            <div class="trf-body">
              <div class="trf-pfh"><span></span><span class="ps-heads seven"><sc-for list="{{ segHeads }}" as="sh" hint-placeholder-count="7"><span title="{{ sh.title }}">{{ sh.label }}</span></sc-for></span></div>
              <sc-for list="{{ pathFlowRows }}" as="pf" hint-placeholder-count="8"><div class="trf-pfr" style="--trf-d:{{ pf.d }}">
                <span class="trf-pl"><i class="trf-dot" data-state="{{ pf.state }}" style="border-radius:{{ pf.rad }}"></i><span title="{{ pf.label }}">{{ pf.label }}</span></span>
                <div class="ps seven sm" aria-label="{{ pf.label }} across the path"><sc-for list="{{ pf.cells }}" as="cl" hint-placeholder-count="7"><span data-state="{{ cl.state }}" data-limited="{{ cl.limited }}" title="{{ cl.title }}"><i><span class="ic s14" style="--ic:url('brand/icons/{{ cl.icon }}.svg')"></span></i></span></sc-for></div>
              </div></sc-for>
            </div>
            <div class="trf-cf"><div aria-label="Health legend" class="trf-key"><span><i style="border-radius:9999px;background:var(--viz-1)"></i>Healthy</span><span><i style="border-radius:9999px;background:var(--warning)"></i>At risk</span><span><i style="border-radius:9999px;background:var(--viz-5)"></i>Over SLO</span><span><i style="border-radius:2px;background:var(--error)"></i>Down</span><span title="Limited view: not AT&amp;T's to measure"><i style="box-sizing:border-box;background:transparent;border:2px solid var(--text-light)"></i>Limited</span><span title="Not yet measured"><i style="box-sizing:border-box;background:transparent;border:1.5px dashed var(--text-disabled)"></i>Not yet</span></div><button class="ins-go" onClick="{{ trfHealth.paths.go }}" title="{{ trfHealth.paths.title }}" aria-label="{{ trfHealth.paths.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfHealth.paths.icon }}.svg')"></span>{{ trfHealth.paths.label }}</button></div>
          </div>
          <div class="fx-card trf-card" data-span="5" aria-label="Open problems" style="--trf-i:1">
            <div class="trf-ch"><button class="cst-hb" onClick="{{ trfHealth.tickets.go }}" title="Open problems, ranked by apps affected: {{ trfHealth.tickets.title }}"><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/exclamation-circle.svg')"></span></span><b>Open problems</b><span class="ic s16 cst-chev" style="--ic:url('brand/icons/chevron-right.svg')"></span></button><span class="vchip ins-v trf-end" data-tone="bad" role="img" title="{{ queueCount }} open" aria-label="{{ queueCount }} open"><span class="ic s16" style="--ic:url('brand/icons/exclamation-circle.svg')"></span><b>{{ queueCount }}</b></span></div>
            <sc-if value="{{ hasProblems }}" hint-placeholder-val="{{ true }}">
            <div class="trf-body trf-probs"><sc-for list="{{ problemRows }}" as="pb" hint-placeholder-count="3"><div class="trf-prob" style="--trf-d:{{ pb.d }}">
              <span class="trf-sev" data-state="{{ pb.state }}" title="{{ pb.stateWord }}" style="border-radius:{{ pb.rad }}"><span class="ic s16" style="--ic:url('brand/icons/{{ pb.stateIcon }}.svg')"></span></span>
              <b class="trf-pn" title="{{ pb.where }} · {{ pb.thing }}: {{ pb.what }} · {{ pb.startedF }}">{{ pb.where }} · {{ pb.thing }}</b>
              <span class="trf-pv"><sc-if value="{{ pb.ticketed }}" hint-placeholder-val="{{ false }}"><span class="kchip" title="{{ pb.ticketF }}"><span class="ic s14" style="--ic:url('brand/icons/checklist.svg')"></span><b>{{ pb.ticketId }}</b></span></sc-if><sc-if value="{{ pb.canTicket }}" hint-placeholder-val="{{ true }}"><button class="trf-verb" onClick="{{ pb.ticketAct.go }}" title="{{ pb.ticketAct.title }}" aria-label="{{ pb.ticketAct.aria }}"><span class="ic s16" style="--ic:url('brand/icons/checklist.svg')"></span></button></sc-if><button class="cst-do" data-primary="{{ pb.first }}" onClick="{{ pb.verb.go }}" title="{{ pb.verb.title }}"><span class="ic s14" style="--ic:url('brand/icons/{{ pb.verb.icon }}.svg')"></span>{{ pb.verb.label }}</button></span>
              <span class="trf-pw" title="{{ pb.what }}">{{ pb.whatShort }}</span>
              <span class="trf-pm"><span class="kchip" title="Who holds the SLA: {{ pb.ownerLabel }}"><span class="ic s14" style="--ic:url('brand/icons/{{ pb.ownerIcon }}.svg')"></span><b>{{ pb.ownerLabel }}</b></span><span class="kchip" title="{{ pb.appsF }}"><span class="ic s14" style="--ic:url('brand/icons/apps.svg')"></span><b>{{ pb.appsN }}</b></span><span class="kchip" title="{{ pb.startedF }}{{ pb.changeSay }}"><span class="ic s14" style="--ic:url('brand/icons/clock.svg')"></span><b>{{ pb.ago }}</b></span></span>
            </div></sc-for>
            <sc-if value="{{ probPager.many }}" hint-placeholder-val="{{ false }}"><div class="cst-pgr"><span class="cst-pager"><span>{{ probPager.label }}</span><button class="fx-btn" onClick="{{ probPager.prev }}" aria-label="Previous problems" style="opacity:{{ probPager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ probPager.next }}" aria-label="Next problems" style="opacity:{{ probPager.nextOp }}">›</button></span></div></sc-if>
            </div>
            </sc-if>
            <sc-if value="{{ trfHealth.noProblems }}" hint-placeholder-val="{{ false }}"><div class="trf-body cst-calm"><span class="cst-calm-i"><span class="ic s24" style="--ic:url('brand/icons/check-circle.svg')"></span></span><p>No problems open</p></div></sc-if>
            <div class="trf-cf"><span></span><button class="ins-go" data-primary="{{ trfHealth.cta.primary }}" onClick="{{ trfHealth.cta.go }}" title="{{ trfHealth.cta.title }}" aria-label="{{ trfHealth.cta.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfHealth.cta.icon }}.svg')"></span>{{ trfHealth.cta.label }}</button></div>
          </div>
        </div>
        </sc-if>
        <!-- App health (2026-10-06 session: "we need to define what app healthy means ... VMs running hot, a memory leak in the database, the
             network at 80% ... maybe you can customize your thresholds"): one row per app, its path's state, its compute, database and
             network against your thresholds, its share on AT&T as a ring and its policies as a glyph, and a verdict whose why is its title. -->
        <sc-if value="{{ healthInCloud }}" hint-placeholder-val="{{ false }}">
        <div class="fx-card trf-card trf-ah" aria-label="App health" style="--trf-i:0">
          <div class="trf-ch"><span class="cst-hb"><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/smart-meter.svg')"></span></span><b>App health</b></span><span class="note-i" role="note" aria-label="How it is modelled" title="An app is healthy when its path holds its SLO and its compute, database and network stay under your thresholds. Compute, database and network are modelled from each cloud's own monitoring (Azure application health, CloudWatch, Cloud Monitoring), the busiest hour of the last 30 days. The tick on each meter is your threshold; within 8 points under it reads at risk, and a database whose memory climbs and is never released (↑) is at risk whatever it reads."><span class="ic s16" style="--ic:url('brand/icons/information-circle.svg')"></span></span><div role="group" aria-label="Your thresholds" class="trf-thr trf-end"><sc-for list="{{ appThreshCtl }}" as="tc" hint-placeholder-count="3"><span class="ah-step" title="{{ tc.title }}"><span class="ic s14" style="--ic:url('brand/icons/{{ tc.icon }}.svg');color:var(--text-light)"></span>{{ tc.label }}<button onClick="{{ tc.dec }}" disabled="{{ tc.decOff }}" aria-label="Lower the {{ tc.label }} threshold">−</button><b>{{ tc.valueF }}</b><button onClick="{{ tc.inc }}" disabled="{{ tc.incOff }}" aria-label="Raise the {{ tc.label }} threshold">+</button></span></sc-for></div></div>
          <div class="trf-body">
            <div class="trf-ahh"><span>App</span><span title="The path's state">Path</span><span class="trf-ahk"><span class="ic s14" style="--ic:url('brand/icons/smart-meter.svg')"></span>Compute</span><span class="trf-ahk"><span class="ic s14" style="--ic:url('brand/icons/database.svg')"></span>Database</span><span class="trf-ahk"><span class="ic s14" style="--ic:url('brand/icons/cloud-transfer.svg')"></span>Network</span><span title="Its share on AT&amp;T">On AT&amp;T</span><span title="Policies enforced on its tag">Policy</span><span>Verdict</span></div>
            <sc-for list="{{ appHealthRows }}" as="ah" hint-placeholder-count="8"><div class="trf-ahr" style="--trf-d:{{ ah.d }}">
              <button class="trf-pl" onClick="{{ ah.open.go }}" title="{{ ah.open.title }}"><i class="trf-dot" data-state="{{ ah.state }}" style="border-radius:{{ ah.rad }}"></i><span>{{ ah.label }}</span></button>
              <span class="trf-ahp" title="{{ ah.pathWord }}"><i class="trf-dot" data-state="{{ ah.pathState }}" style="border-radius:{{ ah.pathRad }}"></i></span>
              <sc-for list="{{ ah.signals }}" as="sg" hint-placeholder-count="3"><span class="trf-ahm" title="{{ sg.title }}"><span class="ah-meter"><i style="width:{{ sg.width }};background:{{ sg.fill }}"></i><b style="left:{{ sg.tick }}"></b></span><b style="color:{{ sg.ink }}">{{ sg.pct }}<sc-if value="{{ sg.leak }}" hint-placeholder-val="{{ false }}"> ↑</sc-if></b></span></sc-for>
              <span class="trf-mini" title="{{ ah.onAtt }} on AT&amp;T" style="--trf-ring:{{ ah.onAttRing }}"></span>
              <span class="trf-pol" data-on="{{ ah.hasPolicy }}" title="{{ ah.policies }}"><span class="ic s16" style="--ic:url('brand/icons/check-shield.svg')"></span></span>
              <b class="trf-verd" title="{{ ah.whyAll }}" style="color:{{ ah.verdictInk }}">{{ ah.verdict }}</b>
            </div></sc-for>
          </div>
          <div class="trf-cf"><span class="trf-key"><span title="Each meter: the app's busiest hour"><i style="background:var(--link)"></i>Busiest hour</span><span title="The tick on each meter is your threshold"><i class="trf-tick"></i>Your threshold</span></span><button class="ins-go" data-primary="{{ trfHealth.cta.primary }}" onClick="{{ trfHealth.cta.go }}" title="{{ trfHealth.cta.title }}" aria-label="{{ trfHealth.cta.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfHealth.cta.icon }}.svg')"></span>{{ trfHealth.cta.label }}</button></div>
        </div>
        </sc-if>
        <!-- By segment (notes, 2026-09-30): the stakeholder's nine rows, who answers for each piece and what we can see of it, the words in
             each row's title. A row drills in place: sites by place, clouds by cloud then region. -->
        <sc-if value="{{ segTable }}" hint-placeholder-val="{{ false }}">
        <div class="fx-card trf-card trf-seg-card" aria-label="Health by segment" style="--trf-i:0">
          <div class="trf-ch"><span class="cst-hb"><span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/network-folder.svg')"></span></span><b>By segment</b></span><span class="trf-key trf-end"><span title="Who holds the SLA for each piece"><span class="ic s14" style="--ic:url('brand/icons/check-shield.svg')"></span>Owner</span><span title="What we can see of it now"><span class="ic s14" style="--ic:url('brand/icons/eye.svg')"></span>Now</span></span></div>
          <div class="trf-body"><sc-for list="{{ segRows }}" as="sg" hint-placeholder-count="9"><button class="trf-sgr" onClick="{{ sg.open }}" title="What we show: {{ sg.show }}" style="cursor:{{ sg.cursor }};--trf-d:{{ sg.d }}">
            <span class="ic-tile"><span class="ic s16" style="--ic:url('brand/icons/{{ sg.icon }}.svg')"></span></span>
            <span class="trf-sgl"><b title="{{ sg.label }}">{{ sg.label }}</b><sc-if value="{{ sg.limited }}" hint-placeholder-val="{{ false }}"><span class="trf-lim" title="Not AT&amp;T's to measure: reachability and delay from the AT&amp;T side"><span class="ic s14" style="--ic:url('brand/icons/eye-off.svg')"></span>Limited view</span></sc-if></span>
            <span class="kchip" title="Who holds the SLA"><span class="ic s14" style="--ic:url('brand/icons/{{ sg.ownerIcon }}.svg')"></span><b>{{ sg.ownerLabel }}</b></span>
            <span class="trf-sgn"><i class="trf-dot" data-state="{{ sg.state }}" data-limited="{{ sg.limited }}" style="border-radius:{{ sg.rad }}"></i><span><b title="{{ sg.nowFull }}">{{ sg.nowText }}</b><small>{{ sg.nowSub }}</small></span></span>
            <span class="trf-src" role="img" title="Source: {{ sg.source }}" aria-label="Source: {{ sg.source }}"><span class="ic s16" style="--ic:url('brand/icons/database.svg')"></span></span>
            <span class="ic s14 est-caret" aria-hidden="true" style="--ic:url('brand/icons/chevron-right.svg');opacity:{{ sg.caretOp }}"></span>
          </button></sc-for></div>
          <div class="trf-cf"><span></span><button class="ins-go" data-primary="{{ trfHealth.cta.primary }}" onClick="{{ trfHealth.cta.go }}" title="{{ trfHealth.cta.title }}" aria-label="{{ trfHealth.cta.aria }}"><span class="ic s16" style="--ic:url('brand/icons/{{ trfHealth.cta.icon }}.svg')"></span>{{ trfHealth.cta.label }}</button></div>
        </div>
        </sc-if>
        <sc-if value="{{ segOpen }}" hint-placeholder-val="{{ false }}">
        <div class="fx-card trf-card trf-seg-card" aria-label="Segment instances" style="--trf-i:0">
          <div class="trf-ch"><nav aria-label="Segment drill" class="trf-crumbs"><sc-for list="{{ segCrumbs }}" as="sgc" hint-placeholder-count="2"><button onClick="{{ sgc.go }}" style="font-weight:{{ sgc.weight }};color:{{ sgc.color }}">{{ sgc.label }}</button><sc-if value="{{ sgc.notLast }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true">›</span></sc-if></sc-for></nav><span class="kchip trf-end" title="Owner {{ segOwner }} · {{ segSource }}"><span class="ic s14" style="--ic:url('brand/icons/check-shield.svg')"></span><b>{{ segOwner }}</b></span></div>
          <div class="trf-body"><sc-for list="{{ segDrillRows }}" as="sd" hint-placeholder-count="6"><button class="trf-sdr" onClick="{{ sd.go }}" title="{{ sd.sub }}" style="cursor:{{ sd.cursor }}">
            <i class="trf-dot" data-state="{{ sd.state }}" style="border-radius:{{ sd.rad }}"></i>
            <b>{{ sd.name }}</b>
            <span>{{ sd.sub }}</span>

<section data-screen-label="S4 Compose" style="animation:fadeIn .3s;display:grid;gap:14px;grid-template-columns:minmax(0,1fr)">
  <div style="display:grid;gap:6px">
    <h1 style="margin:0;font-size:26px;line-height:32px;font-weight:700;letter-spacing:-.03em;color:var(--text-heading)">Connect</h1>
    <sc-if value="{{ hasParsedNote }}" hint-placeholder-val="{{ false }}"><div class="fx-alert" role="status"><div class="fx-alert-body"><span class="fx-alert-icon" aria-hidden="true"></span><div><div class="fx-alert-title">{{ parsedNoteTitle }}</div><div class="fx-alert-text">{{ parsedNote }}</div></div></div></div></sc-if>
  </div>
  <!-- The steps as the vertical tab group (2026-10-02), under What, Where, How, Terms and Review; a step's mark is done only when you passed it, dashed when your estate filled it. -->
  <div style="display:grid;grid-template-columns:176px minmax(0,1fr) 300px;gap:20px 24px;align-items:start">
    <nav class="fw-vtabs" aria-label="Steps" style="width:176px;padding-right:10px;gap:2px"><sc-for list="{{ cfSteps }}" as="st" hint-placeholder-count="6"><div style="display:grid;gap:2px"><sc-if value="{{ st.catFirst }}" hint-placeholder-val="{{ true }}"><span class="fw-vcat" style="padding-top:{{ st.catPad }}">{{ st.cat }}</span></sc-if><button class="fw-vtab step" role="tab" aria-selected="{{ st.isCurrent }}" aria-current="{{ st.aria }}" onClick="{{ st.go }}" disabled="{{ st.off }}" title="{{ st.sub }}"><span class="mk" data-state="{{ st.state }}">{{ st.mark }}</span><span class="lbl"><span>{{ st.title }}</span><sc-if value="{{ st.hasValue }}" hint-placeholder-val="{{ false }}"><small>{{ st.sub }}</small></sc-if></span></button></div></sc-for></nav>
    <div style="display:grid;gap:14px;min-width:0">
      <!-- The way this order rides (2026-10-06), picked on Recommended or Ways to connect: its mark, its name for this cloud, who sets it up and how long, and the door back to where it was chosen. -->
      <sc-if value="{{ cfWay.has }}" hint-placeholder-val="{{ false }}"><div aria-label="Way to connect" style="display:flex;align-items:center;gap:12px;min-width:0;padding:10px 14px;border:1px solid var(--border-secondary);border-radius:14px;background:var(--bg-wash)"><span class="ic-tile s32"><span class="ic s18" style="--ic:url('brand/icons/{{ cfWay.icon }}.svg')"></span></span><span style="display:grid;gap:1px;min-width:0;flex:1"><span class="way-kicker">{{ cfWay.kicker }}</span><span style="display:flex;align-items:baseline;gap:10px;min-width:0"><b style="flex:none;font-size:14px;line-height:19px;color:var(--text-heading);white-space:nowrap">{{ cfWay.title }}</b><sc-if value="{{ cfWay.hasZone }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;font-weight:600;color:var(--link);white-space:nowrap">{{ cfWay.zone }}</span></sc-if><span title="{{ cfWay.setupTitle }}" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:help"><span class="ic s14" style="--ic:url('brand/icons/wrench.svg')"></span>{{ cfWay.setup }}</span></span></span><sc-if value="{{ cfWay.canChange }}" hint-placeholder-val="{{ false }}"><button class="fx-btn" onClick="{{ cfWay.change }}" style="flex:none">{{ cfWay.changeLabel }}</button></sc-if></div></sc-if>
      <div style="display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;min-width:0"><h2 style="margin:0;font-size:20px;line-height:26px;font-weight:700;color:var(--text-heading);text-wrap:pretty">{{ cfTitle }}</h2><span style="font-size:13px;line-height:18px;color:var(--text-light);text-wrap:pretty;min-width:0">{{ cfDesc }}</span></div>
      <sc-if value="{{ cfWipList.has }}" hint-placeholder-val="{{ false }}">
        <div aria-label="{{ cfWipList.title }}" style="display:grid;gap:4px;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:700;color:var(--text-heading)">{{ cfWipList.title }}</span><button class="fx-btn" onClick="{{ cfWipList.close }}" aria-label="Close the list">Close</button></div>
          <div><sc-for list="{{ cfWipList.rows }}" as="wl" hint-placeholder-count="3"><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--border-secondary);min-width:0"><span style="font-size:13px;line-height:18px;font-weight:600;color:var(--text-heading);overflow-wrap:anywhere">{{ wl.name }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light);overflow-wrap:anywhere">{{ wl.sub }}</span></div></sc-for></div>
          <sc-if value="{{ cfWipList.pager.many }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;line-height:16px;color:var(--text-light)"><span>{{ cfWipList.pager.label }}</span><button class="fx-btn" onClick="{{ cfWipList.pager.prev }}" aria-label="Previous page" style="opacity:{{ cfWipList.pager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ cfWipList.pager.next }}" aria-label="Next page" style="opacity:{{ cfWipList.pager.nextOp }}">›</button></div></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ cfWipList.none }}" hint-placeholder-val="{{ true }}">
      <sc-if value="{{ cfIsType }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
          <sc-for list="{{ cfTypes }}" as="ct" hint-placeholder-count="9">
            <div style="display:grid;grid-template-rows:1fr auto;gap:4px;padding:10px 12px;border:1px solid {{ ct.border }};border-radius:12px;background:{{ ct.bg }};min-width:0;opacity:{{ ct.op }}">
              <button onClick="{{ ct.pick }}" disabled="{{ ct.disabled }}" aria-pressed="{{ ct.on }}" style="display:grid;gap:2px;align-content:start;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;font:inherit;min-width:0">
                <span style="display:flex;align-items:center;gap:6px;min-width:0"><span aria-hidden="true" style="width:14px;height:14px;border-radius:9999px;border:2px solid {{ ct.checkRing }};background:{{ ct.check }};flex:none;box-sizing:border-box"></span><span style="font-size:13px;line-height:18px;font-weight:700;color:{{ ct.ink }};overflow-wrap:anywhere">{{ ct.label }}</span></span>
                <span style="font-size:12px;line-height:16px;color:var(--text-body);text-wrap:pretty">{{ ct.description }}</span>
              </button>
              <div style="display:flex;align-items:center;gap:6px;min-width:0;min-height:18px">
                <sc-if value="{{ ct.hasCount }}" hint-placeholder-val="{{ true }}"><button onClick="{{ ct.openSet }}" aria-pressed="{{ ct.setOn }}" style="border:0;background:transparent;padding:0;font:inherit;font-size:12px;line-height:16px;font-weight:600;color:var(--link);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;min-width:0;overflow-wrap:anywhere">{{ ct.phrase }}</button></sc-if>
                <sc-if value="{{ ct.noCount }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;color:var(--text-disabled)">{{ ct.none }}</span></sc-if>
                <sc-if value="{{ ct.hasFits }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-size:12px;line-height:16px;font-weight:700;color:var(--success);text-align:right;min-width:0;overflow-wrap:anywhere">{{ ct.fits }}</span></sc-if>
                <sc-if value="{{ ct.soon }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-size:12px;line-height:16px;font-weight:700;color:var(--text-body);white-space:nowrap">Coming soon</span></sc-if>
              </div>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{ waySet.has }}" hint-placeholder-val="{{ false }}">
          <div aria-label="What it applies to" style="display:grid;gap:4px;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="font-size:13px;line-height:18px;font-weight:700;color:var(--text-heading)">{{ waySet.title }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light);flex:1;min-width:0">{{ waySet.head }}</span><button class="fx-btn" onClick="{{ waySet.close }}" aria-label="Close the list">Close</button></div>
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px"><sc-for list="{{ waySet.rows }}" as="wr" hint-placeholder-count="4"><div style="display:grid;gap:0;padding:6px 0;border-top:1px solid var(--border-secondary);min-width:0"><span style="font-size:12px;line-height:16px;font-weight:600;color:var(--text-heading);overflow-wrap:anywhere">{{ wr.name }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light);overflow-wrap:anywhere">{{ wr.sub }}</span></div></sc-for></div>
            <sc-if value="{{ waySet.pager.many }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:12px;line-height:16px;color:var(--text-light)"><span>{{ waySet.pager.label }}</span><button class="fx-btn" onClick="{{ waySet.pager.prev }}" aria-label="Previous page" style="opacity:{{ waySet.pager.prevOp }}">‹</button><button class="fx-btn" onClick="{{ waySet.pager.next }}" aria-label="Next page" style="opacity:{{ waySet.pager.nextOp }}">›</button></div></sc-if>
          </div>
        </sc-if>
      </sc-if>
      <sc-if value="{{ cfIsType }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;gap:4px;min-width:0">
          <label for="cf-say" style="font-size:12px;line-height:16px;font-weight:600;color:var(--text-light)">Or just say it</label>
          <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px">
            <input id="cf-say" value="{{ freeText }}" onChange="{{ setFreeText }}" placeholder="AWS us-west-2 to the internet, no direct internet path, firewall in path" style="height:36px;padding:0 14px;border:1px solid var(--border-secondary);border-radius:9999px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:13px;min-width:0" style-focus="border-color:var(--border-active);outline:2px solid var(--border-active);outline-offset:1px"></input>
            <button onClick="{{ parseText }}" style="height:36px;padding:0 16px;border:1px solid var(--cta);border-radius:9999px;background:transparent;color:var(--link);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap" style-hover="background:var(--bg-accent)">Fill</button>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ cfIsProvider }}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{ cfMulti }}" hint-placeholder-val="{{ false }}"><div style="font-size:13px;line-height:18px;color:var(--text-body)">Select two or more clouds to link through one Hub.</div></sc-if>
        <sc-if value="{{ noCfClouds }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-secondary)"><span style="flex:1;min-width:0;font-size:13px;line-height:19px;color:var(--text-body)">{{ cfNoCloudsLine }}</span><button class="fx-btn" onClick="{{ cfAddSource }}">Add a source</button></div></sc-if>
        <div><sc-for list="{{ cfClouds }}" as="cg" hint-placeholder-count="3">
          <div style="display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--border-secondary);opacity:{{ cg.op }}">
            <span style="display:grid;gap:0;min-width:0"><span style="display:flex;align-items:center;gap:8px;min-height:34px"><sc-if value="{{ cg.hasMark }}" hint-placeholder-val="{{ true }}"><span class="way-logo" aria-hidden="true" style="background-image:url('{{ cg.mark }}')"></span></sc-if><span style="font-size:14px;line-height:20px;font-weight:700;color:var(--text-heading)">{{ cg.cloud }}</span></span><sc-if value="{{ cg.cant }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ cg.cantWord }}</span></sc-if></span>
            <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cg.regions }}" as="rg" hint-placeholder-count="3"><button onClick="{{ rg.pick }}" disabled="{{ rg.off }}" aria-pressed="{{ rg.on }}" style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border:1px solid {{ rg.border }};border-radius:10px;background:{{ rg.bg }};font:inherit;cursor:{{ rg.cursor }};text-align:left"><span aria-hidden="true" style="width:14px;height:14px;border-radius:9999px;border:2px solid {{ rg.checkRing }};background:{{ rg.check }};flex:none;box-sizing:border-box"></span><span style="display:grid;gap:0"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ rg.ink }};white-space:nowrap">{{ rg.region }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light);white-space:nowrap">{{ rg.sub }}</span></span></button></sc-for></div>
          </div>
        </sc-for></div>
      </sc-if>
      <sc-if value="{{ cfIsEndpoints }}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{ cfEndpoints.hasDcs }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px">
          <div style="display:grid;gap:8px;align-content:start;min-width:0"><span style="font-size:13px;line-height:17px;font-weight:700;color:var(--text-heading)">{{ cfEndpoints.a.label }}</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cfEndpoints.a.sites }}" as="ea" hint-placeholder-count="3"><button onClick="{{ ea.pick }}" aria-pressed="{{ ea.on }}" style="display:grid;gap:0;padding:6px 12px;border:1px solid {{ ea.border }};border-radius:10px;background:{{ ea.bg }};font:inherit;cursor:pointer;text-align:left;opacity:{{ ea.op }}"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ ea.ink }};white-space:nowrap">{{ ea.name }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ ea.sub }}</span></button></sc-for></div>
            <span style="font-size:12px;line-height:16px;color:var(--text-light)">Connects through</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cfEndpoints.a.fabrics }}" as="fa" hint-placeholder-count="2"><button onClick="{{ fa.pick }}" aria-pressed="{{ fa.on }}" style="display:grid;gap:0;padding:6px 12px;border:1px solid {{ fa.border }};border-radius:10px;background:{{ fa.bg }};font:inherit;cursor:pointer;text-align:left"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ fa.ink }};white-space:nowrap">{{ fa.label }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ fa.sub }}</span></button></sc-for></div>
          </div>
          <div style="display:grid;gap:8px;align-content:start;min-width:0"><span style="font-size:13px;line-height:17px;font-weight:700;color:var(--text-heading)">{{ cfEndpoints.b.label }}</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cfEndpoints.b.sites }}" as="eb" hint-placeholder-count="3"><button onClick="{{ eb.pick }}" aria-pressed="{{ eb.on }}" style="display:grid;gap:0;padding:6px 12px;border:1px solid {{ eb.border }};border-radius:10px;background:{{ eb.bg }};font:inherit;cursor:pointer;text-align:left;opacity:{{ eb.op }}"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ eb.ink }};white-space:nowrap">{{ eb.name }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ eb.sub }}</span></button></sc-for></div>
            <span style="font-size:12px;line-height:16px;color:var(--text-light)">Connects through</span>
            <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cfEndpoints.b.fabrics }}" as="fb" hint-placeholder-count="2"><button onClick="{{ fb.pick }}" aria-pressed="{{ fb.on }}" style="display:grid;gap:0;padding:6px 12px;border:1px solid {{ fb.border }};border-radius:10px;background:{{ fb.bg }};font:inherit;cursor:pointer;text-align:left"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ fb.ink }};white-space:nowrap">{{ fb.label }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ fb.sub }}</span></button></sc-for></div>
          </div>
        </div>
        <div style="font-size:12px;line-height:17px;color:var(--text-light);text-wrap:pretty">Prerequisite: each colo cage must already be cross-connected to Equinix Fabric or Digital Realty ServiceFabric. NetBond Advanced connects into it on demand, with no new AT&amp;T cross-connect.</div>
        </sc-if>
      </sc-if>
      <sc-if value="{{ cfIsBasic }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;gap:8px">
          <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span style="font-size:14px;line-height:20px;font-weight:700;color:var(--text-heading)">Resiliency</span><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ cfTierProtects }}</span></div>
          <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><sc-for list="{{ cfTiers }}" as="tr" hint-placeholder-count="3">
            <button onClick="{{ tr.pick }}" aria-pressed="{{ tr.on }}" style="display:grid;gap:3px;align-content:start;padding:8px 12px;border:1px solid {{ tr.border }};border-radius:12px;background:{{ tr.bg }};font:inherit;cursor:pointer;text-align:left;min-width:0;opacity:{{ tr.op }}">
              <span style="display:flex;align-items:center;gap:6px"><span aria-hidden="true" style="width:14px;height:14px;border-radius:9999px;border:2px solid {{ tr.checkRing }};background:{{ tr.check }};flex:none;box-sizing:border-box"></span><span style="font-size:14px;line-height:18px;font-weight:700;color:{{ tr.ink }}">{{ tr.tier }}</span><sc-if value="{{ tr.soon }}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;font-size:12px;line-height:16px;font-weight:700;color:var(--link);white-space:nowrap">Coming soon</span></sc-if></span>
              <span style="font-size:12px;line-height:16px;color:var(--text-body);text-wrap:pretty">{{ tr.protects }}</span>
              <sc-if value="{{ tr.becomes }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;line-height:16px;font-weight:700;color:var(--link)">{{ tr.becomes }}</span></sc-if>
              <span style="display:grid;gap:0;padding-top:4px;border-top:1px solid var(--border-secondary);font-size:12px;line-height:16px;color:var(--text-body)"><span><b style="font-weight:600;color:var(--text-heading)">Security</b> {{ tr.security }}</span><span><b style="font-weight:600;color:var(--text-heading)">Performance</b> {{ tr.performance }}</span><span><b style="font-weight:600;color:var(--text-heading)">Cost</b> {{ tr.cost }}</span></span>
              <sc-if value="{{ tr.costSub }}" hint-placeholder-val="{{ true }}"><span style="font-size:12px;line-height:16px;color:var(--text-light)">{{ tr.costSub }}</span></sc-if>
            </button>
          </sc-for></div>
        </div>
        <sc-if value="{{ cfShowLoc }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;gap:8px;min-width:0">
          <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span style="font-size:14px;line-height:20px;font-weight:700;color:var(--text-heading)">{{ cfLocTitle }}</span><sc-if value="{{ hasCfAreas }}" hint-placeholder-val="{{ true }}"><span role="tablist" aria-label="Location areas" style="display:flex;gap:12px;flex-wrap:wrap"><sc-for list="{{ cfAreas }}" as="ar" hint-placeholder-count="3"><button role="tab" aria-selected="{{ ar.on }}" onClick="{{ ar.go }}" style="border:0;border-bottom:2px solid {{ ar.line }};background:transparent;padding:0 1px 2px;font:inherit;font-size:12px;line-height:16px;font-weight:{{ ar.weight }};color:{{ ar.ink }};cursor:pointer;white-space:nowrap">{{ ar.label }}</button></sc-for></span></sc-if></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px"><sc-for list="{{ cfMetros }}" as="mt" hint-placeholder-count="4"><button onClick="{{ mt.pick }}" aria-pressed="{{ mt.on }}" title="{{ mt.nearAll }}" style="display:grid;gap:0;min-height:36px;box-sizing:border-box;padding:4px 12px;border:1px solid {{ mt.border }};border-radius:10px;background:{{ mt.bg }};font:inherit;cursor:pointer;text-align:left;max-width:240px;min-width:0"><span style="font-size:13px;line-height:17px;font-weight:600;color:{{ mt.ink }};white-space:nowrap">{{ mt.metro }}</span><span style="font-size:12px;line-height:16px;color:var(--text-light);overflow-wrap:anywhere">{{ mt.near }}</span></button></sc-for></div>
        </div>
        </sc-if>
        <!-- Bandwidth as a section like Resiliency and Location (Micah, 2026-10-02: "bandwidth options are bunched in"): the head above, equal pills on one grid. -->
        <div style="display:grid;gap:8px;min-width:0">
          <span style="font-size:14px;line-height:20px;font-weight:700;color:var(--text-heading)">Bandwidth</span>
          <div role="group" aria-label="Bandwidth" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;max-width:560px"><sc-for list="{{ cfBandwidths }}" as="bw" hint-placeholder-count="5"><button onClick="{{ bw.pick }}" aria-pressed="{{ bw.on }}" style="height:36px;padding:0 12px;border:1px solid {{ bw.border }};border-radius:10px;background:{{ bw.bg }};color:{{ bw.ink }};font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap">{{ bw.label }}</button></sc-for></div>
        </div>
      </sc-if>
      <!-- Advanced Settings in two sections (2026-10-06 session: "just do routing and security ... have a header, and maybe the options are not available yet"): the sentence the policy ships as, then Routing (the QoS classifier, the routing requirements, and the NetBond Advanced route rules they push, rule by rule and direction by direction) and Security (inspection and segmentation, then what is not offered yet, said so). -->
      <sc-if value="{{ cfIsAdvanced }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;line-height:19px;color:var(--text-body);text-wrap:pretty">The policy ships with the order and is enforced from delivery; Govern shows it in the same words. When <b style="color:var(--link)">{{ cfPolicySent.match }}</b> reaches <b style="color:var(--link)">{{ cfPolicySent.scope }}</b>, require <b style="color:var(--link)">{{ cfPolicySent.req }}</b>. <button class="rec-link cf-eng" onClick="{{ cfEngineGo }}" title="{{ cfEngineTitle }}"><span class="ic s14" style="--ic:url('brand/icons/gear.svg')"></span>See it in the policy engine</button></div>
        <div class="fw-sec" aria-label="Routing">
          <h4><span class="ic s16" style="--ic:url('brand/icons/shuffle.svg');color:var(--link)"></span>Routing<span style="font-size:12px;line-height:16px;font-weight:400;color:var(--text-light)">How traffic is carried, and the route rules NetBond Advanced pushes for it</span></h4>
          <sc-if value="{{ hasCfQos }}" hint-placeholder-val="{{ true }}">

        <span style="flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--text-light);text-align:right;text-wrap:pretty">{{ cfBlock }}</span>

      </div>

    <aside aria-label="Your order, in progress" style="position:sticky;top:24px;padding:16px 18px;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;display:grid;gap:10px;align-content:start;min-width:0">

    </aside>
  </div>
  </sc-if>
</section>

<sc-if value="{{ bwOpen }}" hint-placeholder-val="{{ false }}">
