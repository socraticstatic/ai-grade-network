.fx-hop .n{display:grid;min-width:0}.fx-hop .n b{color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fx-hop .n small{font-size:11px;line-height:14px;color:var(--text-light)}
.fx-hop .ms{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-body)}
.fx-hop .fx-btn{height:24px;padding:0 8px;font-size:11px}
.fx-trace-foot{display:flex;gap:8px;padding-top:6px;align-items:center;font-size:11px;color:var(--text-light)}
@media (max-height:719px){aside[aria-label$="sections"]{position:static!important;height:auto!important}aside[aria-label$="sections"]>div{overflow:visible!important}}
.fx-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.fx-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:9999px;border:1px solid var(--border-secondary);background:var(--bg-wash);color:var(--text-body);font-size:11px;line-height:18px;font-weight:500;white-space:nowrap}
.fx-chip.auto{background:transparent;border-style:dashed;color:var(--text-light)}
.fx-chip.user{background:var(--bg-accent);border-color:transparent;color:var(--link);padding-right:2px}
.fx-chip.add{background:transparent;border-style:dashed;color:var(--link);cursor:pointer}
/* Cost's figures are doors (2026-09-30): a figure, a row, a bar and a column are buttons that read as text until hovered. */
.cost-fig{justify-self:start;display:inline-flex;align-items:baseline;gap:4px;border:0;background:transparent;padding:0;font:inherit;font-size:20px;line-height:26px;font-weight:700;color:var(--text-heading);cursor:pointer;white-space:nowrap;text-align:left;border-radius:4px}
.cost-fig small{font-size:12px;font-weight:500;color:var(--text-light)}
.cost-fig.sm{font-size:17px;line-height:22px}
.cost-fig:hover,.cost-tile:hover .cost-fig{text-decoration:underline;text-underline-offset:3px}
.cost-tile{display:grid;gap:2px;align-content:start;padding:8px 12px;border:1px solid var(--border-secondary);border-radius:10px;min-width:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.cost-tile:hover{border-color:var(--border-primary);background:var(--bg-wash)}
.cost-word{font-size:12px;line-height:16px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-cap{font-size:11px;line-height:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--text-light);white-space:nowrap}
.cost-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;min-height:44px;padding:4px 4px 4px 0;box-sizing:border-box;border:0;border-bottom:1px solid var(--border-secondary);border-radius:0;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer}
.cost-row:hover,.cost-bar:hover,.cost-back:hover{background:var(--bg-wash)}
.cost-row>i{width:10px;height:10px;border-radius:3px;box-sizing:border-box}
.cost-v{font-size:13px;line-height:18px;font-weight:600;color:var(--text-heading);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost-back{display:grid;gap:0;width:100%;padding:6px 4px 6px 0;border:0;border-bottom:1px solid var(--border-secondary);background:transparent;font:inherit;text-align:left;cursor:pointer}
.cost-back b{font-size:13px;line-height:18px;font-weight:700;color:var(--link)}
.cost-back small{font-size:11px;line-height:15px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-col{display:flex;flex-direction:column;justify-content:flex-end;gap:1px;height:100%;min-width:0;padding:0 3px;border:0;background:transparent;cursor:pointer}
.cost-col span{display:block;width:100%;flex:none}
.cost-col:hover span{filter:brightness(1.12)}
.cost-end{position:absolute;left:8px;transform:translateY(-50%);display:inline-flex;align-items:baseline;gap:5px;border:0;background:transparent;padding:0;font:inherit;font-size:12px;line-height:16px;color:var(--text-light);cursor:pointer;white-space:nowrap}
.cost-end b{font-size:14px;font-weight:700;color:var(--text-heading)}
.cost-end:hover b{text-decoration:underline;text-underline-offset:3px}
.cost-bar{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:center;width:100%;min-height:50px;padding:6px 4px 6px 0;box-sizing:border-box;border:0;border-bottom:1px solid var(--border-secondary);background:transparent;font:inherit;text-align:left;cursor:pointer}
.cost-bar b{font-size:13px;line-height:18px;font-weight:700;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-bar small{font-size:11px;line-height:15px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A figure inside a row, its own door (Cost v2, 2026-09-30): Savings rows, By region's save rows. */
.cost-num{display:inline-flex;align-items:baseline;gap:4px;border:0;background:transparent;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums;border-radius:4px}
.cost-num:hover{text-decoration:underline;text-underline-offset:3px}
.cost-num:disabled{cursor:default;text-decoration:none}
.cost-num small{font-size:11px;font-weight:500;color:var(--text-light)}
.cost-srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--border-secondary);font-size:12px;line-height:16px}
.cost-save{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;min-height:48px;padding:6px 0;border-top:1px solid var(--border-secondary)}
.cost-save b{font-size:13px;line-height:18px;font-weight:700;color:var(--text-heading);white-space:nowrap}
.cost-save small{display:block;font-size:11px;line-height:15px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-dbar{grid-column:1 / -1;display:block;height:8px;border-radius:9999px;background:var(--bg-neutral);overflow:hidden}.fx-dbar i{display:block;height:100%}
.fx-chip.add:hover{background:var(--bg-accent);border-color:var(--link)}
.fx-chip-x{width:16px;height:16px;border:0;border-radius:9999px;background:transparent;color:inherit;font-size:13px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center}
.fx-chip-x:hover{background:rgba(0,0,0,.08)}
.fx-label-input{height:24px;padding:0 8px;border:1px solid var(--border-active);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px;min-width:150px;outline:none}
.fx-btn:hover{border-color:var(--border-active)}
.fx-spacer{margin-left:auto}
@keyframes bandBreathe{0%{opacity:.7}50%{opacity:1}100%{opacity:.92}}
/* The band folds and unfolds with an ease and a slight overshoot. Geometry moves through CSS (x, width, d, transform) so the browser eases one state into the other. */
.open-pill{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:9999px;background:var(--bg-accent);color:var(--link);font-size:11px;line-height:20px;font-weight:700;letter-spacing:0;white-space:nowrap;transition:background .15s,color .15s}
.open-n:empty{display:none}
.open-word{display:none}
.open-card:hover .open-word{display:inline}
.open-card:hover .open-n{display:none}
.open-card:hover .open-pill{background:var(--cta);color:#fff}
.open-card:hover .card-rect{stroke:var(--border-active)!important}
.fold-plus{transition:transform .15s}
.fold:hover .fold-plus{transform:scale(1.15)}
.fold{transition:transform .55s cubic-bezier(.34,1.45,.64,1),x .55s cubic-bezier(.34,1.45,.64,1),y .55s cubic-bezier(.34,1.45,.64,1),width .55s cubic-bezier(.34,1.45,.64,1),d .55s cubic-bezier(.34,1.45,.64,1),opacity .3s ease}
@media (prefers-reduced-motion:reduce){.fold{transition:none}.route-dot{display:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes crawl{to{stroke-dashoffset:-24}}
@keyframes pulseOnce{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<div style="position:relative;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:16px;padding:10px 24px 12px;display:flex;align-items:stretch;min-height:{{ heroMinH }}">

<div style="display:grid;gap:10px;width:100%;min-width:0">
<!-- Where you are: one breadcrumb row at the top of the picture, a trail per column (2026-09-25) -->
<div aria-label="Where you are" style="display:flex;justify-content:space-between;align-items:baseline;gap:32px;padding:6px 4px 12px;border-bottom:1px solid var(--border-secondary);font-size:13px;line-height:20px">
  <nav aria-label="Sites breadcrumb" style="display:flex;align-items:baseline;min-width:0;white-space:nowrap"><sc-for list="{{ siteTrail }}" as="tr" hint-placeholder-count="2"><span style="display:inline-flex;align-items:baseline;min-width:0;flex:{{ tr.flex }}"><sc-if value="{{ tr.sep }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="padding:0 8px;color:var(--text-disabled)">›</span></sc-if><sc-if value="{{ tr.isLink }}" hint-placeholder-val="{{ false }}"><button onClick="{{ tr.go }}" title="{{ tr.title }}" style="border:0;background:transparent;padding:0;margin:0;font:inherit;font-weight:500;color:var(--link);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ tr.maxW }}" style-hover="text-decoration:underline">{{ tr.label }}</button></sc-if><sc-if value="{{ tr.isStatic }}" hint-placeholder-val="{{ true }}"><span aria-current="{{ tr.aria }}" title="{{ tr.title }}" style="font-weight:{{ tr.weight }};color:{{ tr.ink }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ tr.maxW }}">{{ tr.label }}</span></sc-if></span></sc-for></nav>
  <!-- The filter row over the picture (Micah, 2026-09-28; wired 2026-09-29): service, location, reach. -->
  <div aria-label="Site filters" style="display:flex;align-items:center;gap:6px;position:relative;align-self:center;font-size:12px">
    <span style="position:relative"><button onClick="{{ toggleSvcMenu }}" aria-label="Filter by service" style="height:24px;padding:0 10px;border:1px solid {{ svcBorder }};border-radius:9999px;background:var(--bg-base);color:{{ svcColor }};font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">{{ svcLabel }} ▾</button>
      <sc-if value="{{ svcMenu }}" hint-placeholder-val="{{ false }}"><div role="menu" style="position:absolute;top:30px;z-index:20;min-width:200px;max-height:none;padding:6px 0;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:grid;left:0"><sc-for list="{{ svcChips }}" as="sv" hint-placeholder-count="6"><button role="menuitemcheckbox" aria-checked="{{ sv.on }}" onClick="{{ sv.go }}" title="{{ sv.title }}" style="display:flex;align-items:center;gap:8px;padding:6px 12px;border:0;background:transparent;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:{{ sv.color }};font-weight:{{ sv.weight }}"><span aria-hidden="true" style="width:12px;height:12px;border-radius:3px;border:1px solid {{ sv.border }};background:{{ sv.bg }}"></span>{{ sv.label }}</button></sc-for><button onClick="{{ closeSvcMenu }}" style="margin:4px 12px 2px;justify-self:end;border:0;background:transparent;color:var(--link);font:inherit;font-size:12px;font-weight:600;cursor:pointer">Done</button></div></sc-if></span>
    <span style="position:relative"><button onClick="{{ toggleLocMenu }}" aria-label="Filter by location" style="height:24px;padding:0 10px;border:1px solid {{ locBorder2 }};border-radius:9999px;background:var(--bg-base);color:{{ locColor2 }};font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap">{{ locLabel }} ▾</button>
      <sc-if value="{{ locMenu }}" hint-placeholder-val="{{ false }}"><div role="menu" style="position:absolute;top:30px;z-index:20;min-width:200px;max-height:none;padding:6px 0;background:var(--bg-base);border:1px solid var(--border-secondary);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:grid;left:0;max-height:360px;overflow:auto"><sc-for list="{{ locOptions }}" as="lo" hint-placeholder-count="6"><button role="menuitem" onClick="{{ lo.go }}" style="padding:{{ lo.pad }};border:0;background:transparent;font:inherit;font-size:13px;text-align:left;cursor:pointer;color:{{ lo.color }};font-weight:{{ lo.weight }}">{{ lo.label }}</button></sc-for></div></sc-if></span>
    <span role="radiogroup" aria-label="Reach" style="display:inline-flex;gap:2px;padding:2px;border-radius:9999px;background:var(--bg-neutral)"><sc-for list="{{ reachChips }}" as="rc" hint-placeholder-count="3"><button role="radio" aria-checked="{{ rc.on }}" onClick="{{ rc.go }}" style="height:20px;padding:0 9px;border:0;border-radius:9999px;background:{{ rc.bg }};color:{{ rc.color }};font:inherit;font-size:12px;font-weight:{{ rc.weight }};cursor:pointer;white-space:nowrap">{{ rc.label }}</button></sc-for></span>
    <sc-if value="{{ filterOn }}" hint-placeholder-val="{{ false }}"><span style="color:var(--text-light);white-space:nowrap">{{ siteFilterCount }}</span><button onClick="{{ clearFilters }}" style="border:0;background:transparent;color:var(--link);font:inherit;font-size:12px;font-weight:600;cursor:pointer">Clear</button></sc-if>
  </div>
  <sc-if value="{{ showOpenHint }}" hint-placeholder-val="{{ false }}"><span role="note" style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 6px 0 12px;border-radius:9999px;background:var(--bg-accent);color:var(--link);font-size:12px;font-weight:600;white-space:nowrap"><span aria-hidden="true">✦</span>Click a region or a cloud to open it<button onClick="{{ dismissOpenHint }}" aria-label="Dismiss the hint" style="border:0;background:transparent;color:var(--link);font:inherit;font-size:14px;line-height:1;cursor:pointer;padding:0 4px">×</button></span></sc-if>
  <nav aria-label="Clouds breadcrumb" style="display:flex;align-items:baseline;min-width:0;white-space:nowrap;margin-left:auto"><sc-for list="{{ cloudTrail }}" as="tc" hint-placeholder-count="2"><span style="display:inline-flex;align-items:baseline;min-width:0;flex:{{ tc.flex }}"><sc-if value="{{ tc.sep }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="padding:0 8px;color:var(--text-disabled)">›</span></sc-if><sc-if value="{{ tc.isLink }}" hint-placeholder-val="{{ false }}"><button onClick="{{ tc.go }}" title="{{ tc.title }}" style="border:0;background:transparent;padding:0;margin:0;font:inherit;font-weight:500;color:var(--link);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ tc.maxW }}" style-hover="text-decoration:underline">{{ tc.label }}</button></sc-if><sc-if value="{{ tc.isStatic }}" hint-placeholder-val="{{ true }}"><span aria-current="{{ tc.aria }}" title="{{ tc.title }}" style="font-weight:{{ tc.weight }};color:{{ tc.ink }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:{{ tc.maxW }}">{{ tc.label }}</span></sc-if></span></sc-for></nav>
</div>
<svg viewBox="{{ heroVB }}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AT&amp;T network picture" onMouseLeave="{{ clearHover }}" style="{{ heroSvgStyle }}">
  <defs>
    <linearGradient id="pipeShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".07"></stop><stop offset=".3" stop-color="#fff" stop-opacity=".16"></stop><stop offset=".55" stop-color="#fff" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".10"></stop></linearGradient>
    <linearGradient id="bandGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e2a4d"></stop><stop offset="1" stop-color="#00235a"></stop></linearGradient>
  </defs>
  <rect x="10" y="22" width="268" height="{{ colTintH }}" rx="12" style="fill:var(--bg-accent);opacity:{{ siteTintOp }};transition:opacity .25s ease"></rect>
  <rect x="{{ cloudTintX }}" y="22" width="268" height="{{ colTintH }}" rx="12" style="fill:var(--bg-accent);opacity:{{ cloudTintOp }};transition:opacity .25s ease"></rect>
  <foreignObject x="24" y="0" width="460" height="18"><div style="display:flex;align-items:center;height:18px"><span style="flex:none;color:var(--text-light);font-size:{{ graphHeadFs }};line-height:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap">Sites</span><span style="flex:1 1 0;min-width:12px"></span><sc-if value="{{ sitesDoor.has }}" hint-placeholder-val="{{ true }}"><button onClick="{{ sitesDoor.open }}" title="{{ sitesDoor.title }}" style="flex:none;border:0;background:transparent;padding:0;color:{{ sitesDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit">{{ sitesDoor.label }}</button></sc-if><sc-if value="{{ sitesDoor.hasNot }}" hint-placeholder-val="{{ false }}"><span style="flex:none;color:{{ sitesDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;white-space:nowrap;font-family:inherit">{{ sitesDoor.label }}</span></sc-if><span style="flex:0 1 {{ sitesDoor.gutter }}px"></span></div></foreignObject>
  <foreignObject x="{{ rightX }}" y="0" width="{{ cloudsHeadW }}" height="18"><div style="display:flex;align-items:center;height:18px"><span style="flex:none;color:var(--text-light);font-size:{{ graphHeadFs }};line-height:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap">Clouds</span><span style="flex:1 1 0;min-width:12px"></span><sc-if value="{{ cloudsDoor.has }}" hint-placeholder-val="{{ true }}"><button onClick="{{ cloudsDoor.open }}" title="{{ cloudsDoor.title }}" style="flex:none;border:0;background:transparent;padding:0;color:{{ cloudsDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit">{{ cloudsDoor.label }}</button></sc-if><sc-if value="{{ cloudsDoor.hasNot }}" hint-placeholder-val="{{ false }}"><span style="flex:none;color:{{ cloudsDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;white-space:nowrap;font-family:inherit">{{ cloudsDoor.label }}</span></sc-if><span style="flex:0 1 {{ cloudsDoor.gutter }}px"></span></div></foreignObject>
  <sc-if value="{{ showWorkloadsHead }}" hint-placeholder-val="{{ true }}"><foreignObject x="1252" y="0" width="136" height="18"><div style="color:var(--text-light);font-size:11px;line-height:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap">Workloads</div></foreignObject></sc-if>

  <sc-for list="{{ heroEdges }}" as="e" hint-placeholder-count="6">
    <g opacity="{{ e.op }}" style="transition:opacity .2s">
      <path class="fold" id="e-{{ e.id }}" d="{{ e.d }}" style="d:path('{{ e.d }}')" fill="none" stroke="{{ e.stroke }}" stroke-width="{{ e.w }}" stroke-dasharray="{{ e.dash }}" stroke-linecap="round"></path>
      <sc-if value="{{ e.amber }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--warning)" stroke-width="6" opacity=".25" style="animation:pulseOnce 1.6s ease-out infinite"></path><path d="{{ e.d }}" fill="none" stroke="transparent" stroke-width="14" onClick="{{ e.openObserve }}" role="button" aria-label="Degraded path: open Observe" style="cursor:pointer"></path></sc-if>
      <sc-if value="{{ e.sleeve }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--error)" stroke-width="{{ e.sleeveW }}" opacity=".22" stroke-linecap="round"></path></sc-if>
      <sc-if value="{{ e.crawl }}" hint-placeholder-val="{{ false }}"><path class="fold" d="{{ e.d }}" fill="none" stroke="{{ e.stroke }}" stroke-width="1.5" stroke-dasharray="6 6" style="d:path('{{ e.d }}');animation:crawl 2s linear infinite"></path></sc-if>
      <sc-if value="{{ e.violPulse }}" hint-placeholder-val="{{ false }}"><circle cx="{{ e.pinX }}" cy="{{ e.pinY }}" r="5" fill="var(--error)"><animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"></animate><animate attributeName="opacity" values="1;.4;1" dur="1.6s" repeatCount="indefinite"></animate></circle></sc-if>
      <sc-if value="{{ e.gate }}" hint-placeholder-val="{{ false }}"><g transform="translate({{ e.gx }} {{ e.gy }})"><rect x="-7" y="-9" width="14" height="18" rx="3" fill="{{ e.gateFill }}" stroke="#0057b8" stroke-width="1.5"></rect><path d="M-3,-1 L-1,1.5 L3,-3" fill="none" stroke="{{ e.gateCheck }}" stroke-width="1.5" stroke-linecap="round"></path></g></sc-if>
      <sc-if value="{{ e.pin }}" hint-placeholder-val="{{ false }}"><g transform="translate({{ e.pinX }} {{ e.pinY }})"><circle r="8" fill="var(--warning)"></circle><text y="3.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">!</text></g></sc-if>
      <sc-if value="{{ e.hasLabel }}" hint-placeholder-val="{{ false }}"><foreignObject x="{{ e.lx }}" y="{{ e.ly }}" width="92" height="18" style="pointer-events:none"><div style="display:flex;justify-content:flex-end"><span style="font-size:10px;line-height:20px;font-weight:700;color:var(--text-heading);white-space:nowrap;padding:0 6px;border-radius:6px;background:var(--bg-base);opacity:.92">{{ e.label }}</span></div></foreignObject></sc-if>
      
      <sc-if value="{{ e.hasMath }}" hint-placeholder-val="{{ false }}"><foreignObject x="{{ e.cx }}" y="{{ e.cy }}" width="240" height="22" style="pointer-events:none"><div style="font-size:10px;line-height:20px;padding:0 8px;border-radius:6px;background:var(--bg-base);border:1px solid var(--border-secondary);color:var(--text-body);white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">{{ e.math }}</div></foreignObject></sc-if>
      <sc-if value="{{ e.pulse }}" hint-placeholder-val="{{ false }}"><path d="{{ e.d }}" fill="none" stroke="var(--warning)" stroke-width="3" style="animation:pulseOnce 1.2s ease-out 1 forwards"></path></sc-if>
      <sc-if value="{{ e.priv }}" hint-placeholder-val="{{ false }}">
        <circle r="2.5" fill="#3374cc" opacity=".45"><animateMotion dur="{{ e.durS }}" begin="{{ e.tailBegin }}" repeatCount="indefinite"><mpath href="#e-{{ e.id }}"></mpath></animateMotion></circle>
        <circle r="3.5" fill="#00abeb"><animateMotion dur="{{ e.durS }}" repeatCount="indefinite"><mpath href="#e-{{ e.id }}"></mpath></animateMotion></circle>
        <!-- Traffic flows both ways: the reply runs the same wire from the cloud back. -->
        <circle r="3" fill="#3374cc" opacity=".8"><animateMotion dur="{{ e.durS }}" begin="{{ e.retBegin }}" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#e-{{ e.id }}"></mpath></animateMotion></circle>
      </sc-if>
      <circle cx="{{ e.px }}" cy="{{ e.py }}" r="4" fill="{{ e.portFill }}" stroke="#0057b8" stroke-width="1.5"></circle>
      <sc-if value="{{ e.chip }}" hint-placeholder-val="{{ false }}">
        <rect x="{{ e.chipX }}" y="{{ e.chipY }}" width="{{ e.chipW }}" height="18" rx="9" style="fill:var(--bg-base);stroke:var(--border-secondary)"></rect>
        <foreignObject x="{{ e.chipX }}" y="{{ e.chipY }}" width="{{ e.chipW }}" height="18" style="pointer-events:none"><div style="font-size:13px;line-height:18px;font-weight:500;color:var(--link);text-align:center">{{ e.chip }}</div></foreignObject>
      </sc-if>
      <sc-if value="{{ e.shield }}" hint-placeholder-val="{{ false }}">
        <g transform="translate({{ e.sx }} {{ e.sy }})"><path d="M0,-7 L7,-4 L7,1 Q7,6 0,9 Q-7,6 -7,1 L-7,-4 Z" fill="#0057b8"></path><path d="M-3,0.5 L-1,2.5 L3,-2" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"></path></g>
      </sc-if>
    </g>
  </sc-for>

  <sc-for list="{{ heroArcs }}" as="a" hint-placeholder-count="0">
    <path d="{{ a.d }}" fill="none" stroke="{{ a.stroke }}" stroke-width="1.5" stroke-dasharray="{{ a.dash }}"></path>
  </sc-for>

  <!-- band -->
  <g>
    <rect class="fold" x="{{ bandX }}" y="{{ bandY }}" width="{{ bandW }}" height="{{ bandH }}" rx="16" fill="{{ bandFill }}" style="x:{{ bandX }}px;width:{{ bandW }}px;stroke:var(--band-stroke);animation:bandBreathe 2.4s ease-out 1"></rect>
    <foreignObject class="fold" x="{{ bandLabelX }}" y="0" width="{{ bandW }}" height="18" style="x:{{ bandLabelX }}px;width:{{ bandW }}px"><div style="position:relative;display:flex;align-items:center;justify-content:flex-end;gap:8px;height:18px"><button onClick="{{ toggleBand }}" aria-label="Expand the AT&T network band" style="position:absolute;left:50%;transform:translateX(-50%);border:0;background:transparent;padding:0;color:var(--link);font-size:{{ graphHeadFs }};line-height:18px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;text-align:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit">{{ bandLabel }}</button><sc-if value="{{ bandDoor.has }}" hint-placeholder-val="{{ true }}"><button onClick="{{ bandDoor.open }}" title="{{ bandDoor.title }}" style="flex:none;margin-right:{{ bandDoor.gutter }}px;border:0;background:transparent;padding:0;color:{{ bandDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit">{{ bandDoor.label }}</button></sc-if><sc-if value="{{ bandDoor.hasNot }}" hint-placeholder-val="{{ false }}"><span style="flex:none;margin-right:{{ bandDoor.gutter }}px;color:{{ bandDoor.color }};font-size:{{ graphHeadFs }};line-height:18px;font-weight:600;white-space:nowrap;font-family:inherit">{{ bandDoor.label }}</span></sc-if></div></foreignObject>
    <sc-if value="{{ fabClosed }}" hint-placeholder-val="{{ true }}">
    <sc-for list="{{ segments }}" as="sg" hint-placeholder-count="5">
      <g class="fold" onClick="{{ sg.open }}" role="button" aria-label="{{ sg.tip }}" style="cursor:{{ sg.cursor }};transform:translate({{ sg.x }}px,0px)"><title>{{ sg.tip }}</title>
        <rect class="fold" x="0" y="{{ sg.y }}" width="{{ sg.w }}" height="{{ sg.h }}" style="width:{{ sg.w }}px;fill:{{ sg.fill }}"></rect>
        <line x1="0" y1="{{ sg.y }}" x2="0" y2="{{ sg.bottom }}" stroke-width="1" stroke-dasharray="3 4" style="stroke:var(--band-stroke);opacity:{{ sg.divider }}"></line>
        <g class="fold" style="opacity:{{ sg.edgeOp }}">
          <rect x="{{ sg.stackA }}" y="{{ sg.stackY }}" width="30" height="{{ sg.stackH }}" rx="5" style="fill:var(--bg-base);stroke:var(--border-secondary);opacity:{{ sg.backOp }};filter:drop-shadow(0 1px 2px rgba(0,0,0,.16))"></rect>
          <rect x="{{ sg.stackB }}" y="{{ sg.stackY }}" width="30" height="{{ sg.stackH }}" rx="5" style="fill:var(--bg-base);stroke:var(--border-secondary);filter:drop-shadow(0 1px 2px rgba(0,0,0,.16))"></rect>
          <rect x="{{ sg.stackC }}" y="{{ sg.stackY }}" width="30" height="{{ sg.stackH }}" rx="5" style="fill:{{ sg.frontFill }};stroke:{{ sg.frontStroke }};filter:{{ sg.frontShadow }}"></rect>
        </g>
        <foreignObject class="fold" x="0" y="{{ sg.labelY }}" width="{{ sg.w }}" height="{{ sg.pillH }}" style="pointer-events:none;width:{{ sg.w }}px;opacity:{{ sg.pillOp }}"><div style="text-align:center;line-height:{{ sg.pillLh }}px;white-space:nowrap"><span style="display:inline-block;padding:0 {{ sg.pillPad }}px;border-radius:12px;border:1px solid {{ sg.pillBorder }};background:{{ sg.pillBg }};color:{{ sg.pillColor }};font-size:{{ sg.pillFs }};font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:font-size .3s ease">{{ sg.label }}</span></div></foreignObject>
      </g>
    </sc-for>
    <rect class="fold" x="{{ bandX }}" y="{{ bandY }}" width="{{ bandW }}" height="{{ bandH }}" rx="16" fill="url(#pipeShade)" style="x:{{ bandX }}px;width:{{ bandW }}px;opacity:{{ pipeOp }};pointer-events:none"></rect>
    <sc-for list="{{ pieces }}" as="pc" hint-placeholder-count="12">
      <path class="fold" d="{{ pc.d }}" style="d:path('{{ pc.d }}');fill:none;stroke:{{ pc.stroke }};stroke-width:{{ pc.width }};stroke-dasharray:{{ pc.dash }};stroke-linecap:round"></path>
    </sc-for>
    <sc-for list="{{ routeDots }}" as="rd" hint-placeholder-count="8">
      <path id="{{ rd.id }}" d="{{ rd.d }}" style="fill:none;stroke:none"></path>
      <circle class="route-dot" r="2.2" style="fill:var(--link)" opacity=".85"><animateMotion dur="{{ rd.dur }}" begin="{{ rd.begin }}" repeatCount="indefinite"><mpath href="#{{ rd.id }}"></mpath></animateMotion></circle>
      <circle class="route-dot" r="2.2" style="fill:var(--link)" opacity=".55"><animateMotion dur="{{ rd.dur }}" begin="{{ rd.back }}" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#{{ rd.id }}"></mpath></animateMotion></circle>
    </sc-for>
    <sc-for list="{{ foldTags }}" as="ft" hint-placeholder-count="4">
      <foreignObject class="fold" x="{{ ft.x }}" y="{{ ft.y }}" width="{{ ft.w }}" height="70" onClick="{{ ft.open }}" style="x:{{ ft.x }}px;opacity:{{ ft.op }};pointer-events:{{ ft.pe }};cursor:pointer"><div style="display:flex;justify-content:center;align-items:flex-start;gap:4px;height:70px"><div title="{{ ft.tip }}" style="writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 0;width:24px;box-sizing:border-box;border-radius:9px;border:1px solid var(--border-secondary);background:var(--bg-base);box-shadow:0 1px 3px rgba(0,0,0,.14);text-align:center;line-height:16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-body)">{{ ft.label }}</div><span class="fold-plus" aria-hidden="true" style="flex:none;margin-top:2px;width:16px;height:16px;border-radius:9999px;background:var(--cta);color:#fff;font-size:13px;line-height:16px;font-weight:700;text-align:center">+</span></div></foreignObject>
    </sc-for>
    <sc-for list="{{ nodes }}" as="nd" hint-placeholder-count="10">
      <foreignObject class="fold" x="{{ nd.fx }}" y="{{ nd.fy }}" width="{{ nd.fw }}" height="{{ nd.fh }}" style="x:{{ nd.fx }}px;y:{{ nd.fy }}px;width:{{ nd.fw }}px;height:{{ nd.fh }}px;opacity:{{ nd.op }};pointer-events:{{ nd.pe }}"><div style="display:flex;justify-content:center;height:{{ nd.fh }}px;align-items:center"><div title="{{ nd.title }}" style="max-width:100%;box-sizing:border-box;padding:0 6px 0 4px;height:{{ nd.ph }}px;line-height:{{ nd.plh }}px;border:{{ nd.border }};border-radius:13px;background:var(--bg-base);box-shadow:0 1px 3px rgba(0,0,0,.14);font-size:{{ nd.pfs }};font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:font-size .3s ease,height .3s ease"><span style="display:inline-block;width:{{ nd.pdot }}px;height:{{ nd.pdot }}px;border-radius:4px;margin-right:4px;vertical-align:1px;background:{{ nd.dot }}"></span>{{ nd.label }}</div></div></foreignObject>
    </sc-for>
    <sc-for list="{{ xconnects }}" as="xc" hint-placeholder-count="1">
      <rect class="fold" x="{{ xc.sx }}" y="{{ xc.sy }}" width="{{ xc.s }}" height="{{ xc.s }}" rx="1" style="x:{{ xc.sx }}px;y:{{ xc.sy }}px;fill:var(--bg-base);stroke:var(--text-heading);stroke-width:1.5"><title>{{ xc.title }}</title></rect>
    </sc-for>
    </sc-if>
    <!-- inside the AT&T network (2026-09-09): facilities → ports → circuits, opened in place -->
    <sc-if value="{{ fabOpen }}" hint-placeholder-val="{{ false }}">
