.rec-count{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;font:inherit;font-size:14px;line-height:18px;font-weight:600;color:var(--link);cursor:pointer;white-space:nowrap}.rec-count .ic{color:var(--text-light)}.rec-count:hover{text-decoration:underline}
.rec-step{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 4px;border:1px solid var(--border-secondary);border-radius:9999px;font-size:13px;font-weight:600;color:var(--text-body);font-variant-numeric:tabular-nums}
.rec-step button{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--link);cursor:pointer}.rec-step button:hover{background:var(--bg-wash)}
.rec-grid{display:grid;grid-template-columns:minmax(0,.86fr) 28px repeat(3,minmax(0,1fr));gap:18px;align-items:stretch;min-width:0}
.rec-arrow{display:grid;place-items:center;color:var(--text-disabled)}
.rec-card{display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:16px;box-sizing:border-box;min-width:0;padding:20px;border:1px solid var(--border-secondary);border-radius:20px;background:var(--bg-base);transition:border-color .2s,box-shadow .2s,transform .2s}
.rec-card:hover{border-color:var(--border-active);transform:translateY(-2px);box-shadow:0 14px 34px -20px rgba(15,23,42,.35)}
.rec-card[data-on="true"]{border-color:var(--cta);box-shadow:0 0 0 3px color-mix(in srgb,var(--cta) 16%,transparent)}
.rec-card.today{grid-template-rows:auto;align-content:start;gap:18px;background:var(--bg-wash);border-style:dashed}.rec-card.today:hover{transform:none;box-shadow:none;border-color:var(--border-secondary)}
.rec-pick{display:grid;gap:18px;align-content:start;border:0;background:transparent;padding:0;font:inherit;text-align:left;color:inherit;cursor:pointer;min-width:0}.rec-pick:disabled{cursor:default}
.rec-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.rec-tier{font-size:12px;line-height:16px;font-weight:700;color:var(--text-body);white-space:nowrap}
.rec-price{font-size:13px;line-height:17px;font-weight:600;color:var(--text-body);white-space:nowrap}
.rec-label{display:flex;align-items:center;gap:12px;min-width:0;min-height:44px;font-size:15px;line-height:20px;font-weight:700;color:var(--text-heading)}.rec-label>span:nth-child(2){min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-wrap:balance}
.rec-metrics{display:grid;gap:10px;min-width:0}
.rec-metric{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:10px;min-width:0;border:0;background:transparent;padding:0;font:inherit;font-size:14px;line-height:20px;text-align:left;color:var(--text-light)}
.rec-metric>span:nth-child(2){font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rec-metric small{font-size:12px;font-weight:600;white-space:nowrap}
button.rec-metric{cursor:pointer}button.rec-metric:hover>span:nth-child(2){text-decoration:underline}
.rec-cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;border:1px solid var(--cta);border-radius:12px;background:transparent;color:var(--link);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.rec-cta[data-primary="true"]{background:var(--cta);color:#fff}.rec-cta:hover{background:var(--cta-hover);border-color:var(--cta-hover);color:#fff}
/* The journey's language on Recommended (2026-10-09, "integrate into the rest of the site"): the score ring beside the way's
   name, its reasons as chips that open the Why (the first with its word, the next a glyph, the word in its title), the four
   answers it is ranked by as glyphs in the head, the questions and the Why over the hero. */
.js-score.md{width:40px;height:40px}.js-score.md>b{width:32px;height:32px;font-size:13px}.js-score.sm{width:26px;height:26px}.js-score.sm>b{width:20px;height:20px;font-size:12px}
.rec-label>.js-score{flex:none;margin-left:auto}
.rec-card[data-on="true"] .js-score>b{background:var(--bg-base)}
.rec-why{display:flex;align-items:center;gap:6px;min-width:0;height:24px;border:0;background:transparent;padding:0;font:inherit;cursor:pointer}
.rec-why>.ic:last-child{flex:none;margin-left:auto;color:var(--text-light)}.rec-why:hover>.ic:last-child,.rec-why[aria-expanded="true"]>.ic:last-child{color:var(--link)}
.rec-why .js-wchip{flex:none}.rec-why .js-wchip[data-word="false"]{padding:0 6px}.rec-why .js-wchip[data-word="false"]>span:last-child{display:none}
.rec-needs{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;margin-left:auto;border:1px solid var(--border-secondary);border-radius:9999px;background:var(--bg-base);color:var(--link);font:inherit;cursor:pointer}
.rec-needs>.ic:first-child{color:var(--text-light)}.rec-needs:hover,.rec-needs[aria-expanded="true"]{border-color:var(--border-active)}
.rec-intent-pop{position:absolute;left:30px;right:30px;top:112px;z-index:30;padding:22px 28px;border:1px solid var(--border-active);border-radius:20px;background:var(--bg-base);box-shadow:0 24px 64px color-mix(in srgb,var(--text-heading) 16%,transparent);animation:js-in .35s cubic-bezier(.22,1,.36,1) both}
.rec-intent-pop .js-intent{width:100%}
.rec-link{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;font:inherit;font-size:13px;font-weight:600;color:var(--link);cursor:pointer}.rec-link:hover{text-decoration:underline}
.cs-box{display:flex;align-items:center;gap:10px;min-width:0;box-sizing:border-box;padding:8px 12px;border:1px solid var(--border-secondary);border-radius:12px;background:var(--bg-base);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s}
.cs-box:hover{border-color:var(--border-active)}
/* App health (2026-10-06): a meter per signal with your threshold as a tick on it, and the threshold steppers. */
.ah-meter{position:relative;display:block;height:6px;border-radius:3px;background:var(--bg-neutral)}.ah-meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.ah-meter>b{position:absolute;top:-3px;width:2px;height:12px;margin-left:-1px;border-radius:1px;background:var(--text-heading);opacity:.55}
.ah-step{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px 0 10px;border:1px solid var(--border-secondary);border-radius:9999px;font-size:12px;line-height:16px;color:var(--text-body);white-space:nowrap}
.ah-step b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;color:var(--text-heading)}
.ah-step button{display:grid;place-items:center;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--bg-wash);color:var(--link);font:inherit;font-size:14px;font-weight:700;cursor:pointer}.ah-step button:disabled{color:var(--text-disabled);cursor:default}.cs-box:disabled{cursor:default}.cs-box:disabled:hover{border-color:var(--border-secondary)}
/* Flywheel primitives, as NetBond Advanced draws them (Configure > Policies, the connection's Policies tab). Theme tokens only. */
/* The policy engine (2026-10-07): flow, policies in precedence order, result, left to right. */
.eng{display:grid;gap:16px;position:relative}
.eng-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eng-top-r{display:flex;align-items:center;gap:12px}
.eng-stg{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;box-sizing:border-box;border:1px solid var(--border-secondary);border-radius:16px;background:var(--bg-base);font:inherit;font-size:13px;line-height:18px;font-weight:600;color:var(--text-body);cursor:pointer;white-space:nowrap}
.eng-stg:hover{border-color:var(--border-active)}.eng-stg[aria-pressed="true"]{border-color:var(--cta);color:var(--link)}.eng-stg b{font-variant-numeric:tabular-nums;color:var(--text-heading)}
.eng-chips{display:flex;align-items:center;gap:8px}
.eng-grid{display:grid;grid-template-columns:268px 24px minmax(0,1fr) 24px minmax(0,1.3fr);gap:0 14px;align-items:start}
.eng-col{display:grid;gap:10px;align-content:start;min-width:0}
.eng-h{margin:0 0 2px;display:flex;align-items:center;gap:10px;height:28px;font-size:13px;line-height:17px;font-weight:700;color:var(--text-body)}
.eng-n{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg-accent);color:var(--link);font-size:12px;letter-spacing:0}
.eng-hn{margin-left:auto;font-weight:600;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums;color:var(--text-body)}
.eng-arrow{display:grid;place-items:center;height:200px;color:var(--text-disabled)}
.eng-picks{display:grid;gap:12px}
.eng-pick{position:relative}
.eng-pick+.eng-pick::before{content:"";position:absolute;left:31px;top:-12px;width:2px;height:12px;background:var(--border-secondary)}
.eng-pk{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;box-sizing:border-box;border:1px solid var(--border-secondary);border-radius:14px;background:var(--bg-base);font:inherit;text-align:left;cursor:pointer;color:var(--text-heading)}
.eng-pk:hover,.eng-pk[aria-expanded="true"]{border-color:var(--cta)}
.eng-pk-t{display:grid;gap:1px;flex:1;min-width:0}
.eng-pk-t small{font-size:12px;line-height:16px;font-weight:600;color:var(--text-body)}
.eng-pk-t b{font-size:15px;line-height:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng-menu{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:100%;min-width:288px;box-sizing:border-box;display:grid;gap:2px;padding:6px;border:1px solid var(--border-secondary);border-radius:12px;background:var(--bg-base);box-shadow:0 12px 32px rgba(0,0,0,.18)}
.eng-menu button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:13px;color:var(--text-body);text-align:left;cursor:pointer;white-space:nowrap;min-width:0}
.eng-menu button:hover{background:var(--bg-wash)}.eng-menu button[aria-selected="true"]{background:var(--bg-accent);color:var(--link);font-weight:600}
.eng-scrim{position:fixed;inset:0;z-index:25;border:0;padding:0;background:transparent;cursor:default}
.eng-ex{display:flex;flex-wrap:wrap;gap:8px;padding-top:14px;margin-top:4px;border-top:1px solid var(--border-secondary)}
.eng-ex-h{flex:1 0 100%;font-size:12px;line-height:16px;font-weight:700;color:var(--text-body)}
.eng-tile{flex:1 1 0;min-width:0;display:grid;justify-items:center;gap:6px;padding:10px 2px;border:1px solid var(--border-secondary);border-radius:12px;background:var(--bg-base);font:inherit;font-size:12px;line-height:16px;font-weight:600;color:var(--text-body);cursor:pointer;white-space:nowrap}
.eng-tile .ic{color:var(--text-light)}.eng-tile:hover{border-color:var(--border-active)}
.eng-tile[aria-pressed="true"]{border-color:var(--cta);background:var(--bg-accent);color:var(--link)}.eng-tile[aria-pressed="true"] .ic{color:var(--link)}
.eng-ladder{display:grid;gap:4px}
.eng-rung{display:grid;grid-template-columns:28px 16px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:44px;padding:6px 12px;box-sizing:border-box;border:1px solid transparent;border-radius:12px;background:transparent;font:inherit;text-align:left;cursor:pointer;color:var(--text-heading)}
.eng-rung:hover{border-color:var(--border-active)}
.eng-rung[data-state="decides"],.eng-rung[data-state="adds"],.eng-rung[data-state="agrees"]{background:var(--bg-wash)}
.eng-rung[data-state="staged"]{border:1px dashed var(--border-secondary)}.eng-rung[data-state="staged"] b,.eng-rung[data-state="agrees"] b{font-weight:500;color:var(--text-body)}
.eng-rung[data-lit="true"]{background:var(--bg-accent);border-color:var(--cta)}
.eng-rung b{font-size:13px;line-height:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng-rung[data-state="skip"] b{font-weight:400;color:var(--text-light)}
.eng-res{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:16px;font-weight:600;white-space:nowrap}
.eng-out{padding:14px 18px 18px;border-radius:16px;background:var(--bg-wash)}
.eng-verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:32px}
.eng-verdict .fw-badge.big{height:32px;padding:0 12px;font-size:14px}
.eng-by{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;font:inherit;font-size:14px;line-height:20px;font-weight:600;color:var(--link);cursor:pointer;min-width:0}
.eng-by:hover{text-decoration:underline}.eng-by.off{color:var(--text-light);cursor:default}.eng-by.off:hover{text-decoration:none}
.eng-ps{padding:8px 0 2px}
.eng-comp{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:700;white-space:nowrap;cursor:help}
.eng-whatif{display:flex;align-items:flex-start;gap:8px;padding:0 4px;font-size:12px;line-height:16px;color:var(--text-light);text-wrap:pretty;cursor:help}.eng-whatif .ic{flex:none}
.ps .ps-stamp{position:absolute;right:-7px;bottom:-5px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg-base);box-shadow:0 0 0 2px var(--bg-wash);font-style:normal;color:var(--text-light)}
.ps [data-state="set"] .ps-stamp{color:var(--link)}.ps [data-state="broken"] .ps-stamp,.ps [data-state="down"] .ps-stamp{color:var(--error)}.ps [data-state="risk"] .ps-stamp{color:var(--warning)}.ps [data-state="none"] .ps-stamp{color:var(--text-disabled)}
.eng-ps [data-state="none"] small,.ps.big.eng-ps [data-state="none"] b{color:var(--text-disabled);font-weight:400}
.ps.big.eng-ps [data-state="down"] b{color:var(--error)}.ps.big.eng-ps [data-state="risk"] b{color:var(--warning)}
.eng-code{font:600 10px/13px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:0;color:var(--text-light);text-align:center;overflow-wrap:anywhere;max-width:100%}
.ps [data-state="broken"] .eng-code,.ps [data-state="down"] .eng-code{color:var(--error)}.ps [data-state="risk"] .eng-code{color:var(--warning)}
.eng-push-h{display:flex;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--border-secondary);font-size:13px;line-height:17px;font-weight:700;color:var(--text-body)}
.eng-push-h b{font-size:13px;color:var(--text-heading);letter-spacing:0}
.eng-push-h .rec-link{text-transform:none;letter-spacing:0}
.eng-pushed{display:grid;gap:6px}
.fw-row.eng-rule{display:grid;gap:8px;padding:10px 14px;background:var(--bg-base)}
.eng-rule-h{display:flex;align-items:center;gap:8px;min-width:0}
.eng-rule-h b{flex:1;min-width:0;font-size:13px;line-height:18px;font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng-rule-by{flex:none;max-width:45%;border:0;background:transparent;padding:0;font:inherit;font-size:12px;line-height:16px;color:var(--text-light);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.eng-rule-by:hover{color:var(--link);text-decoration:underline}
.eng-dirs{display:flex;align-items:center;gap:20px;padding-left:2px}
.eng-dir{display:inline-flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--text-body);white-space:nowrap}
.eng-none{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:var(--text-light)}
.eng-sheet{display:grid;gap:6px}
.eng-sec{display:grid;gap:2px}
.eng-sec-h,.eng-srow{display:grid;grid-template-columns:auto minmax(0,1fr) 44px 44px;align-items:center;gap:8px}
.eng-sec-h{grid-template-columns:auto minmax(0,1fr) 44px 44px;padding:0 10px 2px}
.eng-sec-h .eng-sec-d{font-size:12px;line-height:16px;font-weight:600;color:var(--text-light);cursor:help}
.eng-sec-d{display:grid;place-items:center}
.eng-srow{grid-template-columns:14px minmax(0,1fr) 44px 44px;min-height:26px;padding:1px 10px;border-radius:8px;background:var(--bg-base)}
.eng-srow b{font-size:12px;line-height:16px;font-weight:500;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng-srow[data-on="true"] b{font-weight:600;color:var(--text-heading)}
/* Govern > Layers (2026-10-09, slice 2 of the policy engine): four columns, tier bands, a default at each foot, rows lit across columns. */
.lay{display:grid;gap:12px}
.lay-top{display:flex;align-items:center;gap:12px;min-height:32px;min-width:0}
.lay-top .eng-chips{flex:none}
.lay-lit{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;height:32px;padding:0 4px 0 12px;box-sizing:border-box;border-radius:16px;background:var(--bg-accent);color:var(--link)}
.lay-lit b{min-width:0;font-size:13px;line-height:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay-lit small{flex:none;font-size:12px;line-height:16px;color:var(--text-body);white-space:nowrap}
.lay-x{display:grid;place-items:center;flex:none;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:var(--text-light);cursor:pointer}.lay-x:hover{color:var(--link)}
.lay-dirs{display:inline-flex;flex:none;gap:2px;padding:2px;margin-left:auto;border-radius:8px;background:var(--bg-neutral)}
.lay-dirs button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;font:inherit;font-size:13px;line-height:18px;font-weight:500;color:var(--text-light);cursor:pointer;white-space:nowrap}
.lay-dirs button[aria-selected="true"]{background:var(--bg-base);font-weight:700;color:var(--text-heading)}
.lay-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 12px;align-items:stretch}
.lay-col{display:grid;grid-template-rows:auto 1fr auto;gap:6px;min-width:0}
.lay-body{display:grid;gap:6px;align-content:start;min-width:0;min-height:420px}
.lay-h{display:flex;align-items:center;gap:10px;min-width:0;padding:0 2px 8px;border-bottom:2px solid var(--border-secondary)}
.lay-h-t{display:grid;flex:1;min-width:0}.lay-h-t b{font-size:15px;line-height:20px;font-weight:700;color:var(--text-heading)}.lay-h-t small{font-size:12px;line-height:16px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay-peps{display:inline-flex;flex:none;gap:8px;color:var(--text-light)}
.lay-band{display:grid;gap:4px}
.lay-band-h{display:flex;align-items:center;gap:6px;height:20px;padding:0 2px;font-size:12px;line-height:16px;font-weight:700;color:var(--text-body);cursor:help}.lay-band-h b{margin-left:auto;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--text-body)}
.fw-row.lay-row,.fw-row.lay-dflt{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;min-height:48px;padding:5px 10px;box-sizing:border-box;font:inherit;text-align:left}
.lay-row-t{display:grid;gap:2px;min-width:0}
.lay-row-t>b{min-width:0;font-size:13px;line-height:18px;font-weight:600;color:var(--text-heading);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay-row-s{display:flex;align-items:center;gap:6px;min-width:0}
.lay-row-s small{min-width:0;font-size:12px;line-height:16px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lay-row-s .fw-badge{flex:none;height:16px;padding:0 5px;font-size:11px}
.lay-row-g{display:grid;gap:4px;justify-items:center;color:var(--text-light)}
.fw-row.lay-row[data-staged="true"]{background:var(--bg-base);border-style:dashed;border-color:var(--border-secondary)}
.lay[data-lit="true"] .lay-row[data-dim="true"]{opacity:.4}
.fw-row.lay-dflt{grid-template-columns:28px minmax(0,1fr);background:var(--bg-base);border:1px dashed var(--border-secondary)}
.lay-end{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--bg-wash);color:var(--text-light)}
.lay-audit{flex:none;height:16px;padding:0 6px;border-radius:8px;background:var(--bg-neutral);font-size:11px;line-height:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-body)}
.lay-none{padding:6px 2px;font-size:12px;line-height:16px;color:var(--text-light)}
.fw-toggle{position:relative;flex:none;width:36px;height:20px;padding:0;border:0;border-radius:9999px;background:var(--border-primary);cursor:pointer;transition:background .2s}

/* The line is each node's own (Micah, 2026-10-02: centre it in the ovals, never through them): drawn at the node's middle, half a cell on the ends, under an opaque node. */
.ps>span::before{content:"";position:absolute;left:0;right:0;top:calc(var(--n) / 2 - 0.75px);height:1.5px;background:var(--border-secondary)}
.ps>span:first-child::before{left:50%}.ps>span:last-child::before{right:50%}
.ps i{position:relative;display:grid;place-items:center;width:var(--n);height:var(--n);box-sizing:border-box;border-radius:50%;background:var(--bg-base);border:1.5px solid var(--border-secondary);color:var(--text-disabled);font-style:normal}

.ps.big b{font-size:12px;line-height:16px;color:var(--text-heading);text-align:center;text-wrap:pretty}.ps.big [data-state="any"] b{color:var(--text-disabled);font-weight:400}.ps.big [data-state="broken"] b{color:var(--error)}

.ps.xs{--n:18px}.ps.xs i{border-width:1.5px}.ps.xs>span::before{height:1.5px;top:calc(var(--n) / 2 - 0.75px)}.ps.xs .ic{width:11px;height:11px}
