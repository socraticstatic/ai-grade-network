<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-build="__BUILD_SHA__">
  // Load React, ReactDOM and Babel from this folder, never from unpkg (see NaaS Storefront.dc.html).
  window.__resources = {
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react.production.min.js",
    "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom.production.min.js",
    "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "./vendor/babel.min.js"
  };
</script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./storefront.css">
<style>
/* Portal-only rules. Everything else is the storefront's. */
.po-head{display:flex;align-items:center;gap:16px;min-height:40px;margin-bottom:16px}
.po-title{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.03em;color:var(--text-heading)}
.po-counts{display:flex;align-items:center;gap:14px;font-size:13px;line-height:18px;color:var(--text-body);white-space:nowrap}
.po-counts b{color:var(--text-heading)}
.po-synth{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--bg-neutral);font-size:13px;font-weight:500;color:var(--text-body);white-space:nowrap}
.po-empty{padding:24px;border:1px dashed var(--border-secondary);border-radius:12px;color:var(--text-body);font-size:14px}
.po-trail{display:flex;align-items:center;gap:4px;margin:0 0 8px;font-size:13px;line-height:18px}
.po-crumb{border:0;background:transparent;padding:2px 4px;font:inherit;font-size:13px;color:var(--link);cursor:pointer;border-radius:4px}
.po-crumb:hover:not(:disabled){background:var(--bg-wash)}.po-crumb:disabled{color:var(--text-heading);font-weight:700;cursor:default}
.po-trail .po-crumb+.po-crumb::before{content:"›";margin-right:6px;color:var(--text-disabled);font-weight:400}
.po-pager{display:flex;align-items:center;justify-content:flex-end;gap:6px;height:36px;font-size:13px;color:var(--text-body)}
.po-pg{width:28px;height:28px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:16px;line-height:1;cursor:pointer}
.po-pg:disabled{color:var(--text-body);opacity:.5;cursor:default}
.po-mark{display:inline-block;width:18px;height:18px;margin:-3px 8px -3px 0;vertical-align:middle;background:center / contain no-repeat}
.dt-c.po-actc{padding-top:7px;padding-bottom:7px}
.po-band{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center;min-height:96px;padding:12px 20px;margin-bottom:12px;border:1px solid var(--border-secondary);border-radius:12px;background:var(--bg-base);box-sizing:border-box}
.po-band .ps.big{max-width:620px}.po-band .ps.big small{font-size:13px;line-height:18px;color:var(--text-body)}.po-band .ps.big b{font-size:13px}
.po-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.po-tile{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border-secondary);border-radius:10px;background:var(--bg-wash);min-width:0}
.po-tl{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--text-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.po-tile b{font-size:24px;line-height:28px;font-weight:700;letter-spacing:-.02em;color:var(--text-heading);font-variant-numeric:tabular-nums}
.dt-c .js-score.md{display:grid}
.po-needs{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding-top:8px;border-top:1px dashed var(--border-secondary)}.po-needs .po-hint,.po-needs .po-copy{grid-column:1 / -1}
.po-nq{display:grid;gap:4px}.po-ns{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;font-weight:700;color:var(--text-heading)}
.po-needs .po-opts{padding:2px;gap:2px;flex-wrap:wrap}.po-needs .po-opt{height:26px;padding:0 9px;font-size:13px}
.po-copy{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:26px;margin-top:2px}
.po-hint{font-size:13px;line-height:18px;color:var(--text-body)}
.po-rtags{position:relative}.po-rtags .js-tags{flex-wrap:wrap}
.po-palette{position:absolute;left:24px;top:100%;z-index:8;display:flex;flex-wrap:wrap;gap:6px;max-width:380px;padding:8px;border:1px solid var(--border-secondary);border-radius:10px;background:var(--bg-base);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.po-act{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--link);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}.po-act:hover{border-color:var(--border-active)}.po-act>i{font-style:normal}
.po-lead{margin:0 0 10px;font-size:14px;line-height:20px;color:var(--text-body)}
.po-placeholder{color:var(--text-body)}.po-requested{margin-top:10px;color:var(--text-heading);font-weight:600}
.po-intent{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0 0 12px}
.po-q{display:flex;align-items:center;gap:10px}
.po-ql{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-heading);white-space:nowrap}
.po-opts{display:inline-flex;gap:4px;padding:2px;border-radius:8px;background:var(--bg-neutral)}
.po-opt{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--text-body);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.po-opt[aria-pressed="true"]{background:var(--bg-base);color:var(--link);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.po-rank{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--bg-neutral);font-size:13px;font-weight:700;color:var(--text-heading)}
.po-kicker{display:block;padding-left:30px;font-size:13px;line-height:18px;font-weight:400;color:var(--text-body)}
.po-rec{margin-left:8px;padding:2px 6px;border-radius:4px;background:var(--bg-accent);font-size:13px;font-weight:600;color:var(--link);white-space:nowrap}
.dt-r[data-rec="true"] .dt-c{background:color-mix(in srgb, var(--link) 4%, transparent)}
.po-done{font-size:13px;font-weight:600;color:var(--text-heading)}
.po-rules{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:13px;line-height:18px;color:var(--text-body)}
.po-rl{font-weight:700;color:var(--text-heading)}.po-w{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.po-rule{color:var(--text-body)}
.dt-r[data-click="true"]{cursor:pointer}.dt-r[data-click="true"]:hover{background:var(--bg-wash)}
</style>
</head>
<body data-version-pill="off">
<x-dc><template>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AT&amp;T AI-Grade Network · Portal MVP</title>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg-wash);color:var(--text-body);font-size:14px;line-height:20px">
<header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:32px;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary)">
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1;white-space:nowrap"><span style="font-size:12px;line-height:16px;font-weight:700;letter-spacing:.02em;color:#009fdb">AT&amp;T</span><span style="font-size:22px;line-height:26px;letter-spacing:-.03em;color:var(--text-heading)"><span style="font-weight:500">AI-Grade </span><span style="font-weight:700">Network</span></span></div>
  <!-- The product pills: the one you are on carries the fill (Micah, 2026-10-12: "when I click on MVP there's no selected element on the top bar"). NaaS is the door back to the full concept. -->
  <nav aria-label="Products" style="display:flex;gap:4px;align-items:center;white-space:nowrap"><a href="NaaS Storefront.dc.html" aria-current="false" style="height:36px;padding:0 12px;border-radius:8px;background:transparent;color:var(--link);font-size:14px;font-weight:500;display:inline-flex;align-items:center;text-decoration:none">NaaS</a><span aria-current="page" style="height:36px;padding:0 12px;border-radius:8px;background:var(--bg-accent);color:var(--link);font-size:14px;font-weight:500;display:inline-flex;align-items:center">Portal MVP</span></nav>
  <!-- In the journey there is no rail, so one button leads back to the pages (the storefront's grammar). -->
  <sc-if value="{{ journeyOn }}" hint-placeholder-val="{{ false }}"><button class="hdr-cust" onClick="{{ jr.exit }}"><span class="ic s16" style="--ic:url('brand/icons/home.svg')"></span>Pages</button></sc-if>
  <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
    <sc-if value="{{ synthetic }}" hint-placeholder-val="{{ false }}"><span class="po-synth" title="Generated to prove layout at scale, not a customer">Synthetic estate</span></sc-if>
    <span aria-label="Account" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--border-secondary);border-radius:9999px;background:var(--bg-base);color:var(--text-heading);font-size:12px;font-weight:700">LG</span>
  </div>
</header>
<div style="display:grid;grid-template-columns:{{ shellCols }};background:var(--bg-wash)">
<sc-if value="{{ showRail }}" hint-placeholder-val="{{ true }}">
<aside aria-label="Portal sections" style="position:sticky;top:65px;align-self:start;height:calc(100vh - 65px);display:flex;flex-direction:column;padding:16px;border-right:1px solid var(--sidebar-border);background:var(--bg-base);box-sizing:border-box;font-size:14px">
  <div class="rail-scroll" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none">
    <sc-for list="{{ rail }}" as="r" hint-placeholder-count="4">
      <button onClick="{{ r.go }}" aria-current="{{ r.cur }}" aria-label="{{ r.label }}" data-page="{{ r.key }}" style="width:100%;min-height:28px;box-sizing:border-box;padding:4px 8px;margin-bottom:2px;border:0;border-radius:{{ r.radius }};display:flex;align-items:center;gap:8px;background:{{ r.bg }};color:{{ r.color }};font:inherit;font-size:14px;line-height:20px;letter-spacing:-.4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden" style-hover="background:var(--bg-wash)"><span aria-hidden="true" style="width:16px;height:16px;flex:none;background:url('{{ r.icon }}') center / contain no-repeat"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span></button>
    </sc-for>
  </div>
  <!-- The presenter's controls: which fixture, which state (A = confirmed fields, B = the note's maybe fields), the theme, and the way back to the full concept. -->
  <div style="border-top:1px solid var(--border-secondary);padding-top:10px;margin-top:8px;display:grid;gap:8px">
    <label title="Fixture" style="display:grid;font-size:13px;color:var(--text-body)"><select value="{{ fixture }}" onChange="{{ setFixture }}" aria-label="Fixture" style="height:30px;min-width:0;padding:0 6px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:13px"><option value="calloway">Calloway Freight</option><option value="scale">Bank scale (synthetic)</option><option value="remote">Your data</option></select></label>
    <label title="Data state" style="display:grid;font-size:13px;color:var(--text-body)"><select value="{{ stateValue }}" onChange="{{ setStateB }}" aria-label="Data state" style="height:30px;min-width:0;padding:0 6px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:13px"><option value="a">Set 1 · confirmed fields</option><option value="b">Set 2 · with health, utilization, affinity</option></select></label>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" title="{{ themeTitle }}" style="height:32px;border:1px solid var(--border-secondary);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:13px;cursor:pointer">
      <sc-if value="{{ themeIsLight }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></sc-if>
      <sc-if value="{{ themeIsDark }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <span>{{ themeTitle }}</span>
    </button>
    <a href="NaaS Storefront.dc.html" style="font-size:13px;line-height:18px;color:var(--link);text-decoration:none;white-space:nowrap">Full concept ↗</a>
  </div>
</aside>
</sc-if>
<main style="min-width:0;max-width:1392px;margin:0 auto;padding:16px 24px;width:100%;box-sizing:border-box">
  <!-- The journey (drop 2): the storefront's stage on this data. One sentence, three nodes, two wires, one action a beat. -->
  <sc-if value="{{ journeyOn }}" hint-placeholder-val="{{ false }}">
  <section class="js" aria-label="Connect a cloud" data-beat="{{ jr.beat }}">
    <ol class="js-steps" aria-label="Steps"><sc-for list="{{ jr.steps }}" as="st" hint-placeholder-count="6"><li data-state="{{ st.state }}"><button onClick="{{ st.go }}" disabled="{{ st.off }}" aria-current="{{ st.cur }}" title="{{ st.title }}"><i><sc-if value="{{ st.hasIcon }}" hint-placeholder-val="{{ false }}"><span class="ic s14" style="--ic:url('brand/icons/check-circle.svg')"></span></sc-if><sc-if value="{{ st.noIcon }}" hint-placeholder-val="{{ true }}">{{ st.n }}</sc-if></i><span>{{ st.label }}</span></button></li></sc-for></ol>
    <div class="js-body">
    <h1 class="js-line">{{ jr.line }}</h1>
    <div class="js-stage" data-wide="{{ jr.wide }}" data-link="{{ jr.link }}" data-net="{{ jr.net }}" data-flow="{{ jr.flow }}">
      <!-- The circuits AT&T carries: the count, one glyph per circuit (a sample of 20 at scale), the services under them in their inks. -->
      <div class="js-node js-sites" aria-label="Your circuits">
        <span class="js-sites-h"><span class="js-cap">Your circuits</span><b class="js-big">{{ jr.sites.n }}</b></span>
        <div class="js-sitegrid" role="list" aria-label="{{ jr.sites.n }} circuits"><sc-for list="{{ jr.sites.cells }}" as="sc" hint-placeholder-count="20"><span role="listitem" class="ic s20" title="{{ sc.title }}" aria-label="{{ sc.title }}" style="--ic:url('brand/icons/{{ sc.icon }}.svg');color:{{ sc.ink }};animation-delay:{{ sc.d }}"></span></sc-for></div>
        <div class="js-svc"><sc-for list="{{ jr.sites.groups }}" as="sg" hint-placeholder-count="4"><span title="{{ sg.full }}"><span class="ic s16" style="--ic:url('brand/icons/{{ sg.icon }}.svg');color:{{ sg.ink }}"></span><b>{{ sg.nF }}</b>{{ sg.label }}</span></sc-for></div>
      </div>
      <div class="js-wire" data-state="on" aria-hidden="true"><i></i><small>Last mile</small></div>
      <div class="js-node js-att" aria-label="The AT&amp;T network"><b>AT&amp;T</b><span class="js-hub"><span class="ic" style="--ic:url('brand/icons/hub.svg')"></span></span><span class="js-cap">Network</span></div>
      <div class="js-wire" data-state="{{ jr.link }}" aria-hidden="true"><i></i><small>{{ jr.linkWord }}</small></div>
      <div class="js-node js-cloud" data-state="{{ jr.cloud.state }}" aria-label="Your cloud">
        <sc-if value="{{ jr.cloud.unknown }}" hint-placeholder-val="{{ true }}"><span class="js-cap">Your cloud</span><span class="js-q"><span class="ic" style="--ic:url('brand/icons/cloud.svg')"></span><b>?</b></span><span class="js-soft">Unknown to AT&amp;T</span></sc-if>
        <sc-if value="{{ jr.cloud.picking }}" hint-placeholder-val="{{ false }}"><div class="js-provs" role="radiogroup" aria-label="Cloud" style="grid-row:2"><sc-for list="{{ jr.providers }}" as="jp" hint-placeholder-count="4"><button role="radio" aria-checked="{{ jp.on }}" disabled="{{ jp.off }}" onClick="{{ jp.go }}" title="{{ jp.title }}"><span class="js-mark" style="background-image:url('{{ jp.mark }}')"></span></button></sc-for></div><span class="js-key" style="grid-row:3"><span class="ic s16" style="--ic:url('brand/icons/padlock.svg')"></span>{{ jr.cred }}</span></sc-if>
        <sc-if value="{{ jr.cloud.scanning }}" hint-placeholder-val="{{ false }}"><span class="js-ring" style="--p:{{ jr.scanPct }};grid-row:2"><span class="js-mark" style="background-image:url('{{ jr.scanMark }}')"></span></span><ol class="js-scan" style="grid-row:3"><sc-for list="{{ jr.scanSteps }}" as="sc" hint-placeholder-count="4"><li data-state="{{ sc.state }}">{{ sc.word }}</li></sc-for></ol></sc-if>
        <sc-if value="{{ jr.cloud.empty }}" hint-placeholder-val="{{ false }}"><span class="js-cap">{{ jr.cloud.name }}</span><span class="js-q"><span class="ic" style="--ic:url('brand/icons/cloud.svg')"></span></span><span class="js-soft">Nothing discovered yet</span></sc-if>
        <sc-if value="{{ jr.cloud.found }}" hint-placeholder-val="{{ false }}">
          <div class="js-cloudhead"><span class="js-mark sm" style="background-image:url('{{ jr.cloud.mark }}')"></span><b>{{ jr.cloud.name }}</b><span class="kchip" title="{{ jr.cloud.hosted }}s"><span class="ic s14" style="--ic:url('brand/icons/grid.svg')"></span><b>{{ jr.cloud.vpcs }}</b></span><span class="kchip" title="Subnets"><span class="ic s14" style="--ic:url('brand/icons/apis.svg')"></span><b>{{ jr.cloud.subnets }}</b></span></div>
          <div class="js-regions"><sc-for list="{{ jr.regions }}" as="rg" hint-placeholder-count="2"><sc-if value="{{ rg.show }}" hint-placeholder-val="{{ true }}"><div class="js-region">
            <div class="js-rhead"><b>{{ rg.label }}</b><span class="kchip" title="{{ jr.cloud.hosted }}s"><span class="ic s14" style="--ic:url('brand/icons/grid.svg')"></span>{{ rg.vpcsF }}</span><span class="kchip" title="Subnets"><span class="ic s14" style="--ic:url('brand/icons/apis.svg')"></span>{{ rg.subnetsF }}</span><button class="js-tag" aria-pressed="{{ rg.picked }}" onClick="{{ rg.go }}" title="Connect {{ rg.label }} with AT&amp;T">{{ rg.pickWord }}</button></div>
            <!-- The customer's tags on the region (2026-10-12, "the customer may want to add a tag"): facts the portal does not have; they pre-fill the answers. A chip removes itself; + opens the palette. -->
            <sc-if value="{{ rg.showTags }}" hint-placeholder-val="{{ true }}"><div class="js-app po-rtags"><span class="ic s16" style="--ic:url('brand/icons/tag.svg')"></span><span class="js-tags" style="margin-left:0"><sc-for list="{{ rg.tags }}" as="tg" hint-placeholder-count="2"><button class="js-tag" aria-pressed="true" onClick="{{ tg.go }}" title="{{ tg.title }}">{{ tg.t }}</button></sc-for><sc-if value="{{ rg.canTag }}" hint-placeholder-val="{{ true }}"><button class="js-tag js-tag-add" aria-expanded="{{ rg.picking }}" onClick="{{ rg.pick }}" title="Tag {{ rg.label }}"><span class="ic s14" style="--ic:url('brand/icons/plus.svg')"></span></button></sc-if></span><sc-if value="{{ rg.picking }}" hint-placeholder-val="{{ false }}"><div class="js-palette po-palette" role="group" aria-label="Tags for {{ rg.label }}"><sc-for list="{{ rg.palette }}" as="pt" hint-placeholder-count="6"><button class="js-tag" onClick="{{ pt.go }}" title="{{ pt.title }}">{{ pt.t }}</button></sc-for></div></sc-if></div></sc-if>
            <div class="js-app" title="{{ rg.att }}"><span class="ic s16" style="--ic:url('brand/icons/hub.svg')"></span><span>{{ rg.att }}</span><sc-if value="{{ rg.hasBytes }}" hint-placeholder-val="{{ false }}"><span class="js-tags"><span class="kchip" title="Bytes out"><span class="ic s14" style="--ic:url('brand/icons/arrow-right.svg')"></span>{{ rg.bytesWord }}</span></span></sc-if></div>
            <!-- The one choice, under the region it changes (2026-10-12): four sentences, the deck's default read as chosen, and one toggle for the other region. -->
            <sc-if value="{{ rg.needs }}" hint-placeholder-val="{{ false }}"><div class="po-needs" role="group" aria-label="What {{ rg.label }} needs"><span class="po-hint">{{ jr.needs.hint }}</span><sc-for list="{{ jr.needs.questions }}" as="q" hint-placeholder-count="4"><div class="po-nq" role="radiogroup" aria-label="{{ q.stem }}"><span class="po-ns"><span class="ic s14" style="--ic:url('brand/icons/{{ q.icon }}.svg')"></span>{{ q.stem }}</span><div class="po-opts"><sc-for list="{{ q.opts }}" as="o" hint-placeholder-count="3"><button role="radio" class="po-opt" aria-checked="{{ o.on }}" aria-pressed="{{ o.on }}" onClick="{{ o.go }}" title="{{ o.title }}">{{ o.verb }}</button></sc-for></div></div></sc-for><sc-if value="{{ jr.needs.copy.has }}" hint-placeholder-val="{{ false }}"><button class="js-tag po-copy" aria-pressed="{{ jr.needs.copy.on }}" onClick="{{ jr.needs.copy.toggle }}" title="Copy these answers to {{ jr.needs.copy.other }}; change them there if they differ"><span class="ic s14" style="--ic:url('brand/icons/check-circle.svg')"></span>Apply the same to {{ jr.needs.copy.other }}</button></sc-if></div></sc-if>
          </div></sc-if></sc-for></div>
        </sc-if>
      </div>
      <div class="js-net" data-state="{{ jr.net }}" aria-hidden="true"><i class="js-dots"></i><small>{{ jr.netWord }}</small></div>
    </div>
