<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-build="__BUILD_SHA__">
  // Load React, ReactDOM and Babel from this folder, never from unpkg (see NaaS Storefront.dc.html).
  window.__resources = {
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "./vendor/react.production.min.js",
    "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "./vendor/react-dom.production.min.js",
    "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js": "./vendor/babel.min.js"
  };
</script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./storefront.css">
<style>
/* Portal-only rules. Everything else is the storefront's. */
.po-head{display:flex;align-items:center;gap:16px;min-height:40px;margin-bottom:16px}
.po-title{margin:0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.03em;color:var(--text-heading)}
.po-counts{display:flex;align-items:center;gap:14px;font-size:13px;line-height:18px;color:var(--text-body);white-space:nowrap}
.po-counts b{color:var(--text-heading)}
.po-synth{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--bg-neutral);font-size:12px;font-weight:500;color:var(--text-light);white-space:nowrap}
.po-empty{padding:24px;border:1px dashed var(--border-secondary);border-radius:12px;color:var(--text-light);font-size:13px}
</style>
</head>
<body data-version-pill="off">
<x-dc><template>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<title>AT&amp;T AI-grade network · Portal MVP</title>
</helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg-wash);color:var(--text-body);font-size:14px;line-height:20px">
<header style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:32px;height:64px;padding:0 24px;background:var(--bg-base);border-bottom:1px solid var(--border-secondary)">
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1;white-space:nowrap"><span style="font-size:12px;line-height:16px;font-weight:700;letter-spacing:.02em;color:#009fdb">AT&amp;T</span><span style="font-size:22px;line-height:26px;letter-spacing:-.03em;color:var(--text-heading)"><span style="font-weight:500">AI-grade </span><span style="font-weight:700">network</span></span></div>
  <nav aria-label="Products" style="display:flex;gap:4px;align-items:center;white-space:nowrap"><span style="height:36px;padding:0 12px;border-radius:8px;background:var(--bg-accent);color:var(--link);font-size:14px;font-weight:500;display:inline-flex;align-items:center">NaaS</span><span style="height:36px;padding:0 12px;color:var(--text-light);font-size:14px;display:inline-flex;align-items:center">Portal MVP</span></nav>
  <div style="margin-left:auto;display:flex;align-items:center;gap:16px">
    <sc-if value="{{ synthetic }}" hint-placeholder-val="{{ false }}"><span class="po-synth" title="Generated to prove layout at scale, not a customer">Synthetic estate</span></sc-if>
    <span aria-label="Account" style="display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--border-secondary);border-radius:9999px;background:var(--bg-base);color:var(--text-heading);font-size:12px;font-weight:700">LG</span>
  </div>
</header>
<div style="display:grid;grid-template-columns:240px minmax(0,1fr);background:var(--bg-wash)">
<aside aria-label="Portal sections" style="position:sticky;top:65px;align-self:start;height:calc(100vh - 65px);display:flex;flex-direction:column;padding:16px;border-right:1px solid var(--sidebar-border);background:var(--bg-base);box-sizing:border-box;font-size:14px">
  <div class="rail-scroll" style="flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none">
    <sc-for list="{{ rail }}" as="r" hint-placeholder-count="4">
      <button onClick="{{ r.go }}" aria-current="{{ r.cur }}" aria-label="{{ r.label }}" data-page="{{ r.key }}" style="width:100%;min-height:28px;box-sizing:border-box;padding:4px 8px;margin-bottom:2px;border:0;border-radius:{{ r.radius }};display:flex;align-items:center;gap:8px;background:{{ r.bg }};color:{{ r.color }};font:inherit;font-size:14px;line-height:20px;letter-spacing:-.4px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden" style-hover="background:var(--bg-wash)"><span aria-hidden="true" style="width:16px;height:16px;flex:none;background:url('{{ r.icon }}') center / contain no-repeat"></span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">{{ r.label }}</span></button>
    </sc-for>
  </div>
  <!-- The presenter's controls: which fixture, which state (A = confirmed fields, B = the note's maybe fields), the theme, and the way back to the full concept. -->
  <div style="border-top:1px solid var(--border-secondary);padding-top:10px;margin-top:8px;display:grid;gap:8px">
    <label title="Fixture" style="display:grid;font-size:12px;color:var(--text-light)"><select value="{{ fixture }}" onChange="{{ setFixture }}" aria-label="Fixture" style="height:28px;min-width:0;padding:0 6px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px"><option value="calloway">Calloway Freight</option><option value="scale">Bank scale (synthetic)</option></select></label>
    <label title="Data state" style="display:grid;font-size:12px;color:var(--text-light)"><select value="{{ stateValue }}" onChange="{{ setStateB }}" aria-label="Data state" style="height:28px;min-width:0;padding:0 6px;border:1px solid var(--border-secondary);border-radius:6px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px"><option value="a">Set 1 · confirmed fields</option><option value="b">Set 2 · with health, utilization, affinity</option></select></label>
    <button onClick="{{ toggleTheme }}" aria-label="Toggle theme" title="{{ themeTitle }}" style="height:32px;border:1px solid var(--border-secondary);border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--bg-base);color:var(--text-heading);font:inherit;font-size:12px;cursor:pointer">
      <sc-if value="{{ themeIsLight }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></sc-if>
      <sc-if value="{{ themeIsDark }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
      <span>{{ themeTitle }}</span>
    </button>
    <a href="NaaS Storefront.dc.html" style="font-size:12px;line-height:16px;color:var(--link);text-decoration:none;white-space:nowrap">Full concept ↗</a>
  </div>
</aside>
<main style="min-width:0;max-width:1392px;margin:0 auto;padding:16px 24px;width:100%;box-sizing:border-box">
  <sc-if value="{{ pgLastmile }}" hint-placeholder-val="{{ true }}">
  <section aria-label="Last mile">
    <div class="po-head"><h1 class="po-title">Last mile</h1><span class="po-counts"><span><b>{{ counts.circuits }}</b> circuits</span><span><b>{{ counts.networks }}</b> networks</span><span><b>{{ counts.sites }}</b> sites</span></span></div>
    <div class="po-empty">The circuit list, by network then state. Task 3.</div>
  </section>
  </sc-if>
  <sc-if value="{{ pgLinks }}" hint-placeholder-val="{{ false }}">
  <section aria-label="Cloud connections">
    <div class="po-head"><h1 class="po-title">Cloud connections</h1><span class="po-counts"><span><b>{{ counts.links }}</b> connections</span></span></div>
    <div class="po-empty">One row per AT&amp;T cloud connection. Task 4.</div>
  </section>
  </sc-if>
  <sc-if value="{{ pgDiscovery }}" hint-placeholder-val="{{ false }}">
  <section aria-label="Cloud discovery">
    <div class="po-head"><h1 class="po-title">Cloud discovery</h1><span class="po-counts"><span><b>{{ counts.regions }}</b> regions</span><span><b>{{ counts.onAtt }}</b> on AT&amp;T</span></span></div>
    <div class="po-empty">CSP, region, VPC, subnet. Task 5.</div>
  </section>
  </sc-if>
  <sc-if value="{{ pgRecommended }}" hint-placeholder-val="{{ false }}">
  <section aria-label="Recommended">
    <div class="po-head"><h1 class="po-title">Recommended</h1></div>
    <div class="po-empty">The ranked options for a region. Task 6.</div>
  </section>
  </sc-if>
</main>
</div>
</div>
</template></x-dc>
<script>(function(){var d=document.querySelector('x-dc'),t=d&&d.querySelector('template');if(!t)return;window.__resources=window.__resources||{};d.replaceChildren(t.content);})();</script>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { page: 'lastmile', fixture: 'calloway', stateB: false, theme: 'light', drawer: null, trail: [], pick: null, answers: {}, requests: [], region: null }; }
  componentDidMount() { import('./naas-portal-app.js').then(m => { this.app = m; m.init(this); this.forceUpdate(); }).catch(e => console.error(e)); }
  renderVals() {
    if (!this.app) return { theme: this.state.theme, rail: [], pgLastmile: true, counts: {}, fixture: 'calloway', stateValue: 'a', themeIsLight: true, themeTitle: 'Dark mode' };
    return this.app.vals(this);
  }
}
</script>
</body>
</html>
